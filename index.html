<style>/* CactusClicker S8 – Gestaltung "Mitternachtsblau"
   Seitenleiste links, Kacheln statt Tabellen, Akzent Sand + Kaktusgrün. */
:root{
  --bg:#0b1330;--bg2:#0e1738;--panel:#131e45;--panel2:#18254f;--raise:#1f2e5c;
  --line:#22305a;--line2:#2f3f70;--ink:#e6ecfa;--ink2:#b7c3e0;--muted:#8794b8;
  --sand:#8db4ff;--sand2:#b5cdff;--sand-ink:#0a1433;--cactus:#5cc98a;--cactus2:#3a9e68;--cactus-ink:#07200f;
  --danger:#e07a7a;--warn:#e0b45a;--info:#93b9d4;
  --r-c:#c3cad1;--r-g:#6cc477;--r-b:#6aa8e6;--r-p:#b88ce8;--r-o:#e8a24a;
  --t1:#9aa6b2;--t2:#6cc477;--t3:#6aa8e6;--t4:#b88ce8;--t5:#e8a24a;--t6:#e07a92;
  --rad:16px;--rad-s:11px;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 20px rgba(2,6,20,.35);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html[data-theme=light]{
  --bg:#eef2f6;--bg2:#f7f9fb;--panel:#ffffff;--panel2:#f5f8fb;--raise:#e8eef4;
  --line:#dfe6ed;--line2:#cbd5df;--ink:#1b2530;--ink2:#465565;--muted:#728194;
  --sand:#2e6fa0;--sand2:#3b82b8;--sand-ink:#ffffff;--cactus:#24935a;--cactus2:#1c7a4a;--cactus-ink:#ffffff;
  --danger:#c9414b;--warn:#a86e12;--info:#2e6fa0;
  --r-c:#6b7480;--r-g:#2f8f3f;--r-b:#2b67c2;--r-p:#7d43c6;--r-o:#c26a0a;
  --t1:#6b7480;--t2:#2f8f3f;--t3:#2b67c2;--t4:#7d43c6;--t5:#c26a0a;--t6:#c4426b;
  --shadow:0 1px 2px rgba(16,40,70,.06),0 6px 16px rgba(16,40,70,.06);
  color-scheme:light;
}
html[data-theme=light] body{background:var(--bg)}
html[data-theme=light] .rail{background:#ffffff}
html[data-theme=light] .bar{background:rgba(255,255,255,.86)}
html[data-theme=light] .tile{box-shadow:0 1px 2px rgba(16,40,70,.05),0 3px 10px rgba(16,40,70,.05)}
html[data-theme=light] .nextcard{background:linear-gradient(135deg,#ffffff,#eaf3fb)}
html[data-theme=light] .ring::before{background:var(--panel)}
html[data-theme=light] .hero h1{color:#14212e}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) radial-gradient(1200px 600px at 70% -10%,rgba(70,100,200,.16),transparent 70%) fixed;color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--sand)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px}

/* ---------- Gerüst ---------- */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg2);border-right:1px solid var(--line);padding:18px 14px 20px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);padding:4px 6px}
.brand .logo{width:42px;height:42px;flex:none;border-radius:12px;background:var(--panel);border:1px solid var(--line2);padding:4px}
.brand b{display:block;font-size:1.06rem;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:.78rem}
.rail nav{display:grid;gap:16px}
.navgrp h6{margin:0 8px 6px;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.navgrp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;border:0;background:none;text-align:left;color:var(--ink2);font-weight:600;font-size:.93rem;text-decoration:none}
.nav:hover{background:var(--panel);color:var(--ink)}
.nav[aria-current=page]{background:var(--panel2);color:var(--ink);box-shadow:inset 3px 0 0 var(--sand)}
.nav[aria-current=page] svg.i{color:var(--sand)}
.nav span.t{flex:1;min-width:0}
.nav .mini{font-size:.72rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .mini.full{color:var(--cactus)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.soc{display:grid;grid-template-columns:1fr;gap:8px}
.soc a{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 12px;border-radius:12px;text-decoration:none;font-weight:800;font-size:1rem;color:#fff!important;border:0}
.soc a.tw{background:#7a4fd0}.soc a.dc{background:#5865c9}
.soc a:hover{filter:brightness(1.1)}

.soc svg{width:22px;height:22px;fill:currentColor}
.herosoc{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.herosoc a{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:800;font-size:1rem;color:#fff}
.herosoc a.tw{background:#7a4fd0}.herosoc a.dc{background:#5865c9}
.herosoc a:hover{filter:brightness(1.1)}
.herosoc svg{width:22px;height:22px;fill:currentColor}
.modebtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);font-weight:600;font-size:.86rem;color:var(--ink2)}
.modebtn:hover{color:var(--ink)}

.stage{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .crumb{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .crumb small{color:var(--muted);font-weight:600}
.finder{display:flex;align-items:center;gap:10px;min-width:280px;padding:9px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:.9rem}
.finder kbd{margin-left:auto;font:600 .72rem var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--muted)}
.finder:hover{color:var(--ink)}
.burger{display:none;border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:8px}
.page{padding:26px 28px 90px;max-width:1180px;width:100%}
.dock{display:none}

/* ---------- Seitenkopf ---------- */
.hero{display:flex;align-items:center;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.hero .txt{flex:1;min-width:240px}
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sand);font-weight:800}
.hero h1{margin:2px 0 6px;font-size:1.85rem;line-height:1.15;letter-spacing:-.01em}
.hero p{margin:0;color:var(--ink2);max-width:66ch}
.ring{--p:0;width:78px;height:78px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--cactus) calc(var(--p)*1%),var(--raise) 0);position:relative}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
.ring b{position:relative;font-size:1rem;font-variant-numeric:tabular-nums}
.ring small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.72rem;color:var(--muted);font-weight:600}
.ring.sm{width:44px;height:44px}.ring.sm::before{inset:5px}.ring.sm b{font-size:.72rem}

/* ---------- Bausteine ---------- */
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:18px;box-shadow:var(--shadow)}
.box+.box{margin-top:14px}
.box h2,.sec h2{margin:0 0 10px;font-size:1.08rem}
.sec{margin-top:26px}
.sec>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec>header h2{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.lede{color:var(--ink2);margin:0 0 14px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);font-weight:650;font-size:.88rem}
.pill:hover{color:var(--ink);border-color:var(--muted)}
.pill[aria-pressed=true]{background:var(--sand);border-color:var(--sand);color:var(--sand-ink)}
.pills.big .pill{padding:9px 16px;font-size:.92rem}
.pills+.pills{margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:11px;border:1px solid var(--sand);background:var(--sand);color:var(--sand-ink);font-weight:750;font-size:.9rem}
.btn:hover{filter:brightness(1.06)}
.btn.soft{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.soft:hover{background:var(--panel2)}
.btn.warnb{background:var(--danger);border-color:var(--danger);color:#2b0707}
.btn.tiny{padding:5px 10px;font-size:.8rem;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.textbtn{border:0;background:none;padding:0;color:var(--sand);font-weight:650;font-size:.86rem;text-decoration:underline;text-underline-offset:3px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:7px;font-size:.73rem;font-weight:750;background:var(--raise);color:var(--ink2);white-space:nowrap;vertical-align:middle}
.tag.sand{background:color-mix(in srgb,var(--sand) 22%,transparent);color:var(--sand2)}
html[data-theme=light] .tag.sand{color:var(--sand)}
.tag.green{background:color-mix(in srgb,var(--cactus) 20%,transparent);color:var(--cactus)}
.tag.red{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger)}
.tag.q{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.lvl{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;padding:4px 8px;border-radius:10px;background:var(--raise);line-height:1.05}
.lvl small{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.lvl b{font-size:1.02rem;font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:99px;background:var(--raise);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cactus2),var(--cactus));border-radius:inherit}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad-s);padding:12px 14px}
.stat b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.note{border-left:3px solid var(--sand);background:var(--panel);border-radius:0 var(--rad-s) var(--rad-s) 0;padding:12px 16px;margin:14px 0;color:var(--ink2)}
.note h3{margin:0 0 6px;font-size:.95rem;color:var(--ink)}
.note ul{margin:0;padding-left:18px}.note li+li{margin-top:4px}
.note.green{border-color:var(--cactus)}
.note.red{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--panel))}
.note.red h3{color:var(--danger)}
.pairnote{margin:0;padding:7px 10px;border-radius:9px;font-size:.86rem;font-weight:600;color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.pairnote b{color:inherit}
.tile:has(.pairnote){border-color:color-mix(in srgb,var(--danger) 60%,var(--line))}
.soon{border:1px dashed var(--line2);border-radius:var(--rad);padding:18px;text-align:center;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.rar{font-weight:750}
.rar.c{color:var(--r-c)}.rar.g{color:var(--r-g)}.rar.b{color:var(--r-b)}.rar.p{color:var(--r-p)}.rar.o{color:var(--r-o)}
.dotr{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
.dotr.c{background:var(--r-c)}.dotr.g{background:var(--r-g)}.dotr.b{background:var(--r-b)}.dotr.p{background:var(--r-p)}.dotr.o{background:var(--r-o)}
.keyline{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin-top:14px}
.keyline span{display:inline-flex;align-items:center;gap:6px}
.tierb{display:inline-block;padding:1px 7px;border-radius:6px;font-size:.72rem;font-weight:800;color:#0b0f0c;margin-left:6px;vertical-align:middle}
.tierb.t1{background:var(--t1)}.tierb.t2{background:var(--t2)}.tierb.t3{background:var(--t3)}.tierb.t4{background:var(--t4)}.tierb.t5{background:var(--t5)}.tierb.t6{background:var(--t6)}
html[data-theme=light] .tierb{color:#fff}

/* ---------- Filterleiste ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.q{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel)}
.q input{flex:1;border:0;background:none;padding:10px 0;outline:none;min-width:0}
.q svg{color:var(--muted)}
.inp{padding:9px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);min-width:0}
.inp.n{width:96px;text-align:center;font-variant-numeric:tabular-nums}
select.inp{padding-right:28px}
.fld{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);font-weight:600}
.fld.col{flex-direction:column;align-items:flex-start;gap:4px}

/* ---------- Platz-Kopfzeile auf Ausrüstungs-Kacheln ---------- */
.slotline{display:flex;align-items:center;gap:7px;margin:-2px 0 -2px;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sand)}
.slotline svg.i{width:16px;height:16px}
/* (alt) Ausrüstungs-Raster */
.gear-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px;border-radius:var(--rad);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.gcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.gcol .lab{margin:0 0 2px 4px}
.gslot{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:11px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);text-align:left;font-size:.86rem;font-weight:650;min-width:0}
.gslot span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gslot b{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.gslot svg{color:var(--sand)}
.gslot:hover{border-color:var(--sand)}
.gslot.on{background:var(--sand);border-color:var(--sand);color:var(--sand-ink)}
.gslot.on svg,.gslot.on b{color:var(--sand-ink)}
.gslot.full b{color:var(--cactus)}
.gslot.none{opacity:.4}
.q.big{min-width:min(100%,360px);flex-basis:360px}
.q.big input{font-size:1rem;padding:12px 0}
.fold>.fh h2 svg{vertical-align:-3px;color:var(--sand);margin-right:4px}

/* ---------- Haken ---------- */
.tick{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line2);background:var(--bg2);display:inline-grid;place-items:center;padding:0;transition:transform .12s,background .12s,border-color .12s}
.tick svg{width:16px;height:16px;stroke:var(--cactus-ink);stroke-width:3;fill:none;opacity:0;transform:scale(.6);transition:.12s}
.tick:hover{border-color:var(--cactus)}
.tick[aria-pressed=true]{background:var(--cactus);border-color:var(--cactus)}
.tick[aria-pressed=true] svg{opacity:1;transform:none}
.tick:active{transform:scale(.92)}
.tick.s{width:22px;height:22px;border-width:2px}.tick.s svg{width:12px;height:12px}
.tickpair{display:flex;flex-wrap:wrap;gap:8px}
.tickpair label{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:.82rem;font-weight:700;color:var(--ink2);cursor:pointer}
.tickpair label:has([aria-pressed=true]){border-color:color-mix(in srgb,var(--cactus) 50%,var(--line));color:var(--cactus)}
.tickpair label.none{cursor:default;color:var(--muted);font-weight:600;border-style:dashed}
.tickpair .na{width:22px;height:22px;border-radius:50%;border:2px dashed var(--line2);display:grid;place-items:center;font-size:.75rem}

/* ---------- Kacheln ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.tiles.wide{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
.tile{min-width:0;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:border-color .15s,opacity .15s}
.tile:hover{border-color:var(--line2)}
.tile.on{border-color:color-mix(in srgb,var(--cactus) 45%,var(--line))}
.tile.on .tt{color:var(--muted)}
.tile.on::after{content:"";position:absolute;inset:0;border-radius:inherit;background:color-mix(in srgb,var(--cactus) 5%,transparent);pointer-events:none}
.tile.off{opacity:.55}
.tile.hint{border-style:dashed;background:var(--bg2)}
.tile.hint .tt{font-weight:650;font-style:italic}
.tile[class*=rr-]{border-width:2px}
.tile.rr-c{border-color:color-mix(in srgb,var(--r-c) 45%,var(--line))}
.tile.rr-g{border-color:color-mix(in srgb,var(--r-g) 70%,var(--line))}
.tile.rr-b{border-color:color-mix(in srgb,var(--r-b) 75%,var(--line))}
.tile.rr-p{border-color:color-mix(in srgb,var(--r-p) 75%,var(--line))}
.tile.rr-o{border-color:var(--r-o);box-shadow:0 0 0 1px color-mix(in srgb,var(--r-o) 35%,transparent),0 0 18px color-mix(in srgb,var(--r-o) 22%,transparent)}
.tile[class*=rr-]::before{content:"";position:absolute;left:14px;right:14px;top:0;height:3px;border-radius:0 0 3px 3px;background:currentColor;opacity:.9}
.tile.rr-c::before{color:var(--r-c)}.tile.rr-g::before{color:var(--r-g)}.tile.rr-b::before{color:var(--r-b)}.tile.rr-p::before{color:var(--r-p)}.tile.rr-o::before{color:var(--r-o)}
.tile .top{display:flex;align-items:flex-start;gap:12px}
.tile .tt{flex:1;min-width:0;font-weight:750;line-height:1.3;cursor:pointer}
.tile .tt small{display:block;font-weight:500;color:var(--muted);font-size:.83rem;margin-top:3px;line-height:1.4}
.tile .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tile .desc{font-size:.88rem;color:var(--ink2);margin:0}
.tile .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.84rem;margin:0}
.tile .kv dt{color:var(--muted)}.tile .kv dd{margin:0}
.tile.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--sand)}100%{box-shadow:var(--shadow)}}
.matbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);font-size:.8rem;font-weight:700;color:var(--ink2)}
.matbtn svg{width:14px;height:14px;transition:transform .15s}
.matbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.matbtn.full{color:var(--cactus);border-color:color-mix(in srgb,var(--cactus) 40%,var(--line2))}
.mats{border-top:1px dashed var(--line2);padding-top:10px;display:grid;gap:10px}
.mats ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mats li{display:flex;align-items:center;gap:9px;font-size:.88rem}
.mats li.on span{color:var(--muted);text-decoration:line-through}
.mats .facts{display:flex;flex-wrap:wrap;gap:6px}
.mats .facts span{font-size:.76rem;padding:3px 8px;border-radius:7px;background:var(--raise);color:var(--ink2)}
.mats .facts b{color:var(--ink)}
.mats .src{font-size:.74rem;color:var(--muted)}

/* ---------- Gruppen (aufklappbar) ---------- */
.fold{margin-top:14px;border:1px solid var(--line);border-radius:var(--rad);background:var(--bg2);overflow:hidden}
.fold>.fh{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:var(--panel);text-align:left}
.fold>.fh h2{margin:0;flex:1;font-size:1.02rem}
.fold>.fh .chev{transition:transform .15s;color:var(--muted)}
.fold[data-open=false]>.fh .chev{transform:rotate(-90deg)}
.fold>.fh .fm{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.fold>.fh .fm .meter{width:90px}
.fold>.fb{padding:14px}

/* ---------- Datentabellen (kompakt) ---------- */
.dt{border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;background:var(--panel)}
.dt .r{display:grid;gap:12px;padding:9px 16px;align-items:center;border-top:1px solid var(--line);font-size:.9rem}
.dt .r:first-child{border-top:0}
.dt .r.h{background:var(--panel2);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.dt .r:nth-child(even):not(.h){background:color-mix(in srgb,var(--panel2) 50%,transparent)}
.dt .r.now{box-shadow:inset 3px 0 0 var(--sand);background:color-mix(in srgb,var(--sand) 9%,var(--panel))}
.dt .r.off{opacity:.5}
.dt .num{text-align:right;font-variant-numeric:tabular-nums}
.dt .ctr{text-align:center}
.dt.ac .r{grid-template-columns:70px 1fr 120px 120px}
.dt.perlvl .r{grid-template-columns:70px 110px 1fr 90px}
.dt.combo .r{grid-template-columns:110px 90px 1.3fr 1.6fr}
.dt.wid .r{grid-template-columns:1fr 110px 110px}
.dt.blk .r{grid-template-columns:1.2fr 1fr 90px 150px}
.miss{color:var(--warn);font-weight:700}

/* ---------- Start ---------- */
.nextcard{display:flex;align-items:center;gap:20px;padding:20px 22px;border-radius:20px;border:2px solid var(--sand);background:color-mix(in srgb,var(--sand) 10%,var(--panel));box-shadow:var(--shadow)}
.nextcard .ring{width:92px;height:92px}.nextcard .ring::before{inset:9px;background:var(--panel)}
.nextcard .ring b{font-size:1.15rem}
.nextcard .nx{flex:1;min-width:0}
.nextcard h2{margin:4px 0 6px;font-size:1.3rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nextcard p{margin:0;color:var(--ink2)}
.nextcard.done{border-color:var(--cactus);background:color-mix(in srgb,var(--cactus) 10%,var(--panel))}
.btn.big{padding:14px 26px;font-size:1.05rem;border-radius:14px;white-space:nowrap}
.journey{display:grid;gap:10px;counter-reset:j}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--rad);background:var(--panel);border:1px solid var(--line)}
.step .no{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:850;font-size:1.05rem;background:var(--raise);color:var(--ink2)}
.step.mk .no{background:color-mix(in srgb,var(--r-p) 22%,transparent);color:var(--r-p)}
.step.ok .no{background:var(--cactus);color:var(--cactus-ink)}
.step.ok{opacity:.72}
.step.cur{border-color:var(--sand);background:color-mix(in srgb,var(--sand) 8%,var(--panel))}
.step.cur .no{background:var(--sand);color:var(--sand-ink)}
.step h3{margin:0;font-size:1rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step p{margin:3px 0 0;color:var(--ink2);font-size:.88rem}
.step .act{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.area{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--rad);background:var(--panel);border:1px solid var(--line);text-align:left;color:var(--ink)}
.area:hover{border-color:var(--line2);background:var(--panel2)}
.area b{display:block;font-size:.95rem}
.area span{font-size:.8rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two>*,.at2>*,.skgrid>*{min-width:0}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.feed li{min-width:0;display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:9px}
.feed li:hover{background:var(--panel2)}
.feed .go{flex:1;min-width:0;overflow:hidden;border:0;background:none;text-align:left;padding:0}
.feed .go b{display:block;font-weight:650;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .go small{display:block;color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed time{font-size:.74rem;color:var(--muted);white-space:nowrap}
.feed .pip{width:10px;height:10px;border-radius:50%;background:var(--line2);flex:none}
.feed .pip.on{background:var(--cactus)}

/* ---------- Essenzen ---------- */
.ess{gap:8px}
.ess .amt{display:flex;align-items:center;gap:8px}
.ess .amt input{flex:1;min-width:0;width:100%;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.ess .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.78rem;color:var(--muted)}
.ess .nums b{display:block;color:var(--ink);font-size:.9rem;font-variant-numeric:tabular-nums}
.ess .nums .ok{color:var(--cactus)}
.tierh{display:flex;align-items:center;gap:12px;margin:22px 0 10px}
.tierh h2{margin:0;font-size:1.05rem}
.tierh .bar2{flex:1;height:3px;border-radius:3px;opacity:.7}
.tierh span{font-size:.82rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Late / Blöcke ---------- */
.gear .score{text-align:right;font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.gear .score b{display:block;font-size:1.15rem;color:var(--sand);letter-spacing:0}
.gear ul.st{margin:0;padding-left:18px;font-size:.86rem;color:var(--ink2)}
.gear .asp{font-size:.86rem;color:var(--sand2)}
html[data-theme=light] .gear .asp{color:var(--sand)}
.craft .mods{display:flex;flex-wrap:wrap;gap:6px}
.craft .mods span{font-size:.78rem;padding:3px 9px;border-radius:7px;background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.sum4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.chk li{display:flex;align-items:center;gap:9px;font-size:.88rem}
.chk li.on span{color:var(--muted);text-decoration:line-through}

/* ---------- Teiche ---------- */
.pond .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.86rem}
.pond .cols ul{margin:4px 0 0;padding-left:16px;color:var(--ink2)}
.lab{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.numlist{counter-reset:n;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.numlist li{counter-increment:n;display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--rad-s);padding:10px 14px}
.numlist li::before{content:counter(n);flex:none;width:26px;height:26px;border-radius:8px;background:var(--raise);display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--sand)}

/* ---------- Skilltree (neuer Planer) ---------- */
.trees{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.treebtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 14px;border-radius:var(--rad);border:1px solid var(--line);background:var(--panel);text-align:left}
.treebtn b{font-size:.98rem}
.treebtn span{font-size:.78rem;color:var(--muted);font-weight:650}
.treebtn .meter{width:100%}
.treebtn[aria-pressed=true]{border-color:var(--sand);box-shadow:inset 0 0 0 1px var(--sand)}
.skgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.boardwrap{margin-top:10px;background:#3e5a60;border:3px solid #1d2b2f;border-radius:8px;padding:10px 12px 12px;box-shadow:inset 0 0 0 2px #56777e}
.boardtitle{font-weight:900;font-size:1.25rem;letter-spacing:.03em;color:#ffe45c;text-shadow:2px 2px 0 #1d2b2f;margin:0 0 8px 4px}
.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;background:#11191c;padding:4px;border-radius:4px}
.slot{aspect-ratio:1;border-radius:4px;background:#2a3d42;box-shadow:inset 0 0 0 2px #344c52,inset 0 -3px 0 #22343a;display:grid;place-items:center;position:relative;padding:0;border:0;min-width:0}
.slot.conn i{display:block;background:#1d2a2d;border-radius:2px;box-shadow:inset 0 0 0 1px #3b5157}
.slot.conn.h i{width:70%;height:22%}.slot.conn.v i{width:22%;height:70%}
.slot.conn.on i{background:var(--cactus);box-shadow:0 0 8px color-mix(in srgb,var(--cactus) 60%,transparent)}
.node,.slot.base{cursor:pointer;color:#fff}
.slot .ico{width:78%;height:78%;display:grid;place-items:center}
.slot .ico svg{width:100%;height:100%}
.slot .cnt{position:absolute;right:2px;bottom:2px;font-size:.68rem;font-weight:850;line-height:1.25;padding:0 4px;border-radius:4px;background:#0d1417;color:#fff;font-variant-numeric:tabular-nums}
.slot.base{background:#3a5258;box-shadow:inset 0 0 0 2px #6d9aa3}
.slot.base .cnt{background:var(--sand);color:var(--sand-ink)}
.node:hover,.slot.base:hover{box-shadow:inset 0 0 0 2px var(--sand)}
.node.max{box-shadow:inset 0 0 0 3px var(--cactus)}
.node.max .cnt{background:var(--cactus);color:var(--cactus-ink)}
.node.some{box-shadow:inset 0 0 0 3px var(--sand)}
.node.some .cnt{background:var(--sand);color:var(--sand-ink)}
.node.lock .ico{opacity:.45;filter:grayscale(.5)}
.node.dead{box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--danger) 75%,transparent)}
.slot.sel{outline:3px solid #ffe45c;outline-offset:1px;z-index:2}
.node.pulse{animation:flash 1.4s ease}
.basecard{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--rad);background:color-mix(in srgb,var(--sand) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--sand) 30%,var(--line));margin-bottom:6px}
.basecard b{display:block}
.basecard p{margin:2px 0 0;font-size:.84rem;color:var(--ink2)}
.basecard .cnt{margin-left:auto;font-weight:850;font-variant-numeric:tabular-nums;font-size:1.05rem;color:var(--sand2);white-space:nowrap}
html[data-theme=light] .basecard .cnt{color:var(--sand)}
.side{position:sticky;top:76px;display:grid;gap:14px}
.buy{display:grid;gap:10px}
.buy .big{display:flex;align-items:center;justify-content:space-between;gap:10px}
.buy .big b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.buy .big b small{font-size:.9rem;color:var(--muted)}
.buy .ctl{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.buy .ctl button{height:40px;border-radius:11px;border:1px solid var(--line2);background:var(--bg2);font-size:1.2rem;font-weight:800}
.buy .ctl button:disabled{opacity:.35}
.buy .cost{text-align:center;font-size:.82rem;color:var(--muted)}
.buy .cost b{display:block;color:var(--ink);font-size:.95rem}
.buy .mm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.det h3{margin:0;display:flex;align-items:center;gap:10px}
.det h3 .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--bg2);flex:none}
.det h3 .ico svg{width:28px;height:28px}
.det p{margin:10px 0 0;font-size:.9rem;color:var(--ink2)}
.det .bad{color:var(--danger);font-weight:650}
.det .row{display:flex;gap:8px;margin-top:12px}

/* ---------- Attribute ---------- */
.at2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:16px}
.atplan,.atrec{display:flex;flex-direction:column;align-items:center}
.atplan h2,.atrec h2{align-self:flex-start}
.atg{background:radial-gradient(circle at 20% 30%,#7d4a2c 0 18%,transparent 19%),radial-gradient(circle at 75% 70%,#7d4a2c 0 14%,transparent 15%),#6f4126;border:3px solid #f0c552;border-radius:14px;box-shadow:inset 0 0 0 2px #3b2414,0 10px 26px rgba(0,0,0,.35);padding:12px 14px 16px;width:max-content;max-width:100%}
.atg-top{text-align:center;font-weight:800;color:#fff2d2;margin:4px 0 12px;text-shadow:0 2px 0 #3b2414}
.atg-top b{color:#ffd45a}.atg-top b.neg{color:#ff8a7e}.atg-top span{font-weight:600;color:#e8cfa6;font-size:.85rem}
.atg-cols{display:flex;gap:16px;justify-content:center}
.atcol{background:#a8dce6;border:3px solid #0f2027;border-radius:6px;box-shadow:inset 0 0 0 2px #d6f2f7;padding:7px;display:flex;flex-direction:column;gap:7px;position:relative}
.atcol::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:72px;transform:translateX(-50%);background:#2c4a55;border-left:3px solid #0f2027;border-right:3px solid #0f2027}
.atl{display:flex;align-items:center;gap:8px;position:relative}
.ats{width:60px;height:60px;border:3px solid #0f2027;border-radius:5px;background:#2f5564;box-shadow:inset 0 0 0 2px #3f6e7e;position:relative;padding:4px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.ats svg,.at-rec,.at-rec svg{stroke:none}
.ats svg{width:100%;height:100%;display:block}
.ats.sel{border-color:#ffd45a}
.ats.mini{width:36px;height:36px;padding:2px;border-width:2px;box-shadow:none}
.atn{position:absolute;right:-4px;bottom:-4px;min-width:24px;padding:1px 5px;background:#0f2027;color:#fff;font-weight:800;font-size:.76rem;line-height:1.3;border-radius:4px;text-align:center;border:1px solid #6ea9b8}
.atb{width:40px;height:34px;border:3px solid #fff;outline:2px solid #1a0e08;border-radius:3px;background:#f6c34a;box-shadow:inset 0 -4px 0 #e0952a,inset 0 3px 0 #ffe08a;position:relative;padding:0;flex:none}

.atb.pl::before{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2022%2022%22%3E%3Cpath%20d%3D%22M8%201h6v7h7v6h-7v7H8v-7H1V8h7z%22%20fill%3D%22%23ffd257%22%20stroke%3D%22%231a0e08%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M9.5%202.5h3%22%20stroke%3D%22%23fff3b8%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E");width:22px;height:22px}

/* ---------- Suche ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,10,12,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px}

/* ---------- Anziehen (Puppe) ---------- */
.doll{margin:18px 0 6px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}

.dollbox{display:grid;grid-template-columns:62px 72px 150px 72px;grid-template-rows:repeat(5,72px) 72px;gap:6px;padding:12px;border-radius:12px;background:#1b2a58;border:3px solid #0a1230;box-shadow:inset 0 0 0 2px #36498a}
.dcol{display:grid;grid-template-rows:repeat(5,72px);gap:6px;grid-row:1/6}

.dmid{grid-row:1/6;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,#2a3d78,#121c42);border-radius:8px}

.dmid{position:relative}
.dmid canvas.skin{display:none;width:110px;height:220px;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
.dmid .skinname{display:none;position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:.68rem;font-weight:700;color:#e6eef0;text-shadow:0 1px 0 #000}
.dmid.hatskin canvas.skin,.dmid.hatskin .skinname{display:block}.dmid.hatskin .skinname{display:block}
.dmid.hatskin .figur{display:none}
.dbot{grid-column:2/5;grid-row:6;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dslot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:7px;border:2px solid #0a1230;background:#111b40;color:#dbe4fb;padding:4px;min-width:0;overflow:hidden;text-align:center}
.dslot svg.i{width:24px;height:24px;color:#9fb4e6}
.dslot small{font-size:.6rem;line-height:1.1;font-weight:700;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dslot b{position:absolute;right:3px;top:2px;font-size:.62rem;background:#0a1230;border-radius:4px;padding:0 4px}
.dslot.leer{opacity:.35;border-style:dashed}
.dslot.none{opacity:.25;cursor:default}
.dslot.rr-c{border-color:var(--r-c)}.dslot.rr-g{border-color:var(--r-g)}.dslot.rr-b{border-color:var(--r-b)}.dslot.rr-p{border-color:var(--r-p)}.dslot.rr-o{border-color:var(--r-o);box-shadow:0 0 10px color-mix(in srgb,var(--r-o) 40%,transparent)}
.dslot:not(.leer) svg.i{color:#fff}
.dcol.tools .dslot{height:62px}
.dollsum{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.dollsum h3{margin:0 0 10px;font-size:1rem}
.wear{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.wear li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;font-size:.88rem;padding:8px 0;border-top:1px solid var(--line)}
.wear li:first-child{border-top:0}
.wear .sl{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.wear .sl svg.i{width:16px;height:16px;color:var(--sand)}
.golink{border:0;background:none;padding:0;font:inherit;font-weight:750;cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);text-underline-offset:3px}
.wear .wz{margin-top:4px;font-size:.82rem;color:var(--ink2)}
.tilefoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wearbtn{padding:5px 11px;border-radius:9px;border:1px solid var(--sand);background:transparent;color:var(--sand);font-size:.8rem;font-weight:750}
.wearbtn.on{background:var(--sand);color:var(--sand-ink)}
.pill:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:1180px){.doll{grid-template-columns:1fr}.dollbox{justify-self:center}}
@media (max-width:420px){.dollbox{grid-template-columns:48px 60px 1fr 60px;grid-template-rows:repeat(5,60px) 56px;gap:4px;padding:8px}.dcol{grid-template-rows:repeat(5,60px);gap:4px}.dcol.tools{grid-template-rows:repeat(3,48px)}.dcol.tools .dslot{height:48px}.dmid .figur{width:80px}.dmid canvas.skin{width:80px;height:160px}.dslot small{font-size:.52rem}.dslot svg.i{width:20px;height:20px}.wear li{grid-template-columns:1fr;gap:2px}}

/* Attribute / Modifier */
.affixe{display:flex;flex-direction:column;gap:4px;margin:6px 0 2px}
.afx{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.afxn{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:2px}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--sand) 14%,var(--panel2));border:1px solid color-mix(in srgb,var(--sand) 30%,transparent);color:var(--ink)}
.afxkarte{margin:18px 0;padding:16px 18px;border-radius:var(--rad);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.afxkarte h3{margin:0 0 2px}
.afxkarte .afxblock{margin-top:10px}.afxkarte ul{margin:6px 0 0;padding-left:0;list-style:none;display:grid;gap:5px}

/* Talentbaum: nächste Punkte */
.box.steps .sthead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stbar{height:6px;border-radius:3px;background:var(--raise);overflow:hidden;margin-top:8px}.stbar span{display:block;height:100%;background:var(--sand)}
.stlist{list-style:none;margin:0 0 10px;padding:0}
.stlist li button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 2px;color:var(--ink);cursor:pointer;font:inherit}
.stlist li button:hover{background:var(--panel2)}
.stlist .nr{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:var(--raise);color:var(--muted)}
.stlist li.now .nr{background:var(--sand);color:var(--sand-ink)}
.stlist .stx{flex:1;min-width:0;display:flex;flex-direction:column}.stlist .stx b{font-size:.86rem}.stlist .stx b small{color:var(--muted);font-weight:600}
.stlist .stx>small{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stlist li:not(.now) .stx b{font-weight:500}
.sttag{flex:none;font-size:.66rem;padding:2px 7px;border-radius:999px;background:var(--raise);color:var(--ink2)}
.box.steps .row{display:flex;gap:8px}.box.steps .row .btn:first-child{flex:1;justify-content:center}
.slot.node.next{outline:3px solid var(--sand);outline-offset:1px;animation:nextpuls 1.6s ease-in-out infinite}
@keyframes nextpuls{50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){.slot.node.next{animation:none}}
.skgrid>.side{min-width:0}.box.steps{min-width:0;overflow:hidden}.stlist li button{min-width:0}
.box.steps.start .btn.big{width:100%;white-space:normal;justify-content:center}.box.steps .textbtn{margin-top:10px}

/* Stufen als Weg */
.stufen{display:flex;align-items:center;gap:12px;margin:12px 0 6px;flex-wrap:wrap}
.stufen .stlab{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stufen ol{display:flex;list-style:none;margin:0;padding:0;flex-wrap:wrap;gap:0}
.stufen li{display:flex;align-items:center}
.stufen li+li::before{content:"";width:22px;height:2px;background:var(--line2);margin:0 2px}
.stufe-b{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);cursor:pointer;font:inherit}
.stufe-b:hover{border-color:var(--sand)}
.stufe-b .sn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:800;background:var(--raise);color:var(--muted)}
.stufe-b .sx{display:flex;flex-direction:column;line-height:1.1;text-align:left}.stufe-b .sx b{font-size:.86rem}.stufe-b .sx small{font-size:.68rem;color:var(--muted)}
.stufe-b.on{background:var(--sand);border-color:var(--sand);color:var(--sand-ink)}.stufe-b.on .sn{background:var(--sand-ink);color:var(--sand)}.stufe-b.on .sx small{color:var(--sand-ink);opacity:.8}
.stufe-b.voll .sn{background:var(--cactus);color:#08130c}
@media (max-width:600px){.stufen ol{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;max-width:100%}.stufen{flex-wrap:nowrap;flex-direction:column;align-items:flex-start;gap:6px}.stufen li+li::before{width:10px}.stufe-b{padding:5px 10px 5px 5px}}
.sttag.bad{background:color-mix(in srgb,var(--danger) 22%,var(--panel));color:var(--ink)}
</style>

 "fishing": {
  "info": [
   "Jeder Spieler kann bis zu sieben Angel Slots besitzen. Diese gelten für alle Sets aus dem Kleiderschrank. Der erste Slot kostet 100 Münzen und die sechs weiteren Slots kosten jeweils 300 Kristalle.",
   "Nachdem erwerben des ersten Angel Slots kann man in diesem seine Angel ausrüsten. Diese erhält man automatisch. Um nun zu angeln muss man sich vorerst die Lizenz für den ersten See (Smaragdsee) im Eichenwald Biom kaufen (siehe Teiche).",
   "Mit Rechtsklick wirft man seine Angel aus, dann wartet man solange, bis ein Fisch anbeißt. Dies merkt man, indem auf dem Bildschirm ein Minispiel startet. Man versucht den Fisch dauerhaft in der grünen Box zubehalten, bis der grüne Balken voll ist. Die grüne Box bewegt man durch das Spammen der linken Maustaste.",
   "Durch das Angeln von Fischen steigert man sein normales Enzyklopädie Level. Dieses Level ist auf 32 begrenzt und ihr schaltet euch nach und nach Komponenten frei (siehe Komponenten).",
   "Die geangelten Fische können daraufhin bei dem NPC namens Rainpaw zerlegt werden. Dadurch erhält man verschiedenste Fisch Materialien. Diese werden für das Freischalten weiterer Teiche oder für das Herstellen von Komponenten benötigt.",
   "Ab und zu können auch Shiny Fischschwärme erscheinen. Durch das Angeln von Shiny Fischen steigert ihr euer Shiny Level. Dieses ist NICHT begrenzt und seasonübergreifend. Ihr erhaltet pro Level Aufstieg immer einen 0.2% Boni, der mit dem Standart Wert eines Teiches multipliziert wird.",
   "Die Fische sind in fünf verschiedenen Seltenheitsstufen unterteilt. Dazu gibt es verschiedene Farben der Schwärme: Grau, Grün, Blau, Lila und Gelb. In grauen Schwärmen findet man nur graue Fische. In grünen Schwärmen nur graue und grüne usw.",
   "Es kann durch die Fischreusen auch passiv geangelt werden. Jeder Spieler besitzt von Anfang an eine Fischreuse. Alle zehn weitere allgemeine Angellevel erhält man eine weitere Reuse. Diese platziert man, indem man das Wasser am Seerand rechtsklickt. Die Reusen können auch geupgradet werden (siehe Fischreusen)."
  ],

function seit(t) {
  const m = Math.round((Date.now() - t) / 60000);

  const d = Math.round(h / 24); return d === 1 ? 'gestern' : `vor ${d} Tagen`;
}

function mob(label) {
  const m = /^(.*?)\s*T(\d+)$/.exec(String(label).trim()); if (!m) return null;
  const name = MOBNAME[m[1]] || m[1], tier = +m[2]; return { label: label.trim(), name, tier, w: WELLE[name + tier] };
}
function planLevel(t) {
  let m = /^(\d+)\s*-\s*(\d+)$/.exec(t);
  if (m) { const a = Math.max(ERST, +m[1]), b = Math.min(LETZT, +m[2]), o = []; for (let L = a; L <= b; L++) o.push(L); return o; }
  m = /^(\d+)\s*\+\s*(\d+)$/.exec(t); return m ? [+m[1], +m[2]] : [];
}
const mobSchluessel = x => { const i = mob(x); return i ? i.name + i.tier : x; };
function wellenMobs(r) {
  const fehlt = new Set(r.missing === '-' ? [] : r.missing.split(/,\s*/).map(mobSchluessel));
  const brauch = new Set(planLevel(r.levels).map(L => FOLGE[L - ERST]).filter(Boolean));
  if (r.extra !== '-') r.extra.split(/,\s*/).forEach(x => brauch.add(mobSchluessel(x)));
  const L = [...brauch].filter(k => !fehlt.has(k)).map(k => { const m = /^(.*?)(\d+)$/.exec(k); return m ? { n: m[1], t: +m[2] } : { n: k, t: 0 }; })
    .sort((a, b) => a.t - b.t || vergleichDe(a.n, b.n));
  return L.length ? L.map(o => (o.t ? `${o.n} T${o.t}` : o.n)).join(', ') : '-';
}

const slotBasis = s => (s.startsWith('Ring') ? 'Ring' : s === 'Zweitwaffe' ? 'Waffe' : s);
function ausrTeile() {               // alle Teile der aktuellen Auswahl, mit Platz

const SKIN = { img: null, slim: false, zustand: '' };
function skinLaden() {
  if (SKIN.zustand) return; SKIN.zustand = 'laedt';
  const n = encodeURIComponent((INH.social && INH.social.minecraft) || 'ScreamingBlatz');
  const fest = INH.social && INH.social.skin;   // fest eingebauter Skin (PNG als data:-Adresse) hat Vorrang
  const quellen = [...(fest ? [[fest, false]] : []), [`https://mc-heads.net/skin/${n}`, true], [`https://minotar.net/skin/${n}`, true], [`https://mc-heads.net/skin/${n}`, false]];
  const versuch = i => {
    if (i >= quellen.length) { SKIN.zustand = 'fehler'; return; }
    const img = new Image(); if (quellen[i][1]) img.crossOrigin = 'anonymous';
    img.onload = () => {
      if (img.naturalWidth !== 64) return versuch(i + 1);
      try { const c = document.createElement('canvas'); c.width = 64; c.height = 64; const x = c.getContext('2d'); x.drawImage(img, 0, 0); SKIN.slim = x.getImageData(55, 20, 1, 1).data[3] === 0; } catch (e) {}
      SKIN.img = img; SKIN.zustand = 'ok'; skinMalen();
    };
    img.onerror = () => versuch(i + 1);
    img.src = quellen[i][0];
  };
  versuch(0);
}
function skinMalen() {
  const leinw = document.querySelectorAll('canvas.skin'); if (!leinw.length) return;
  if (!SKIN.img) { skinLaden(); return; }
  const I = SKIN.img, alt = I.naturalHeight === 32, a = SKIN.slim ? 3 : 4;
  leinw.forEach(cv => {
    const x = cv.getContext('2d'); x.imageSmoothingEnabled = false; x.clearRect(0, 0, 16, 32);
    const t = (sx, sy, w, h, dx, dy) => x.drawImage(I, sx, sy, w, h, dx, dy, w, h);
    const teile = [
      [8, 8, 8, 8, 4, 0, 40, 8],                                   // Kopf + Hut
      [20, 20, 8, 12, 4, 8, 20, 36],                               // Körper + Jacke
      [44, 20, a, 12, 4 - a, 8, 44, 36],                           // rechter Arm
      alt ? [44, 20, a, 12, 12, 8] : [36, 52, a, 12, 12, 8, 52, 52], // linker Arm
      [4, 20, 4, 12, 4, 20, 4, 36],                                // rechtes Bein
      alt ? [4, 20, 4, 12, 8, 20] : [20, 52, 4, 12, 8, 20, 4, 52]  // linkes Bein
    ];
    for (const p of teile) t(p[0], p[1], p[2], p[3], p[4], p[5]);
    if (!alt) for (const p of teile) if (p[6] != null) t(p[6], p[7], p[2], p[3], p[4], p[5]);
    let R = {}; try { R = JSON.parse(cv.dataset.ruest || '{}'); } catch (e) {}
    ruestungMalen(x, R);

}

<script>/* CactusClicker S8 Checkliste – Skilltree-Planer (eigene Umsetzung)
   Talente nach Stufen geordnet: Eine Stufe tiefer heißt, die Voraussetzungen davor müssen voll geskillt sein. */
'use strict';
const TAL = INH.skilltree;
const BAUM = Object.fromEntries(TAL.trees.map(t => [t.id, t]));
const KNOTEN = {}; for (const t of TAL.trees) for (const n of t.nodes) KNOTEN[t.id + ':' + n.id] = n;
const SPIEL_TITEL = { kaktus: 'Kaktus-Baum', seele: 'Seelen Talentbaum', forschung: 'Forschung Talentbaum' };
const PLAENE = Object.fromEntries(TAL.plans.map(p => [p.id, p]));
const PLAN_TEXT = {
  kaktus: 'Empfohlene Reihenfolge für Kaktus-Leaderboard-Spieler.',
  seelen: 'Empfohlene Reihenfolge für Seelen-Leaderboard-Spieler.',
  casual: 'Empfohlene Reihenfolge für entspanntes Spielen.',
  own: 'Dein eigener Plan: Klick auf ein Talent setzt einen Punkt, Rechtsklick (oder „− Punkt“ rechts) nimmt ihn weg. Fehlt ein Punkt, wird automatisch einer gekauft.'
};

/* ---------- Zustand (mit Übernahme aus dem alten Planer) ---------- */
function talentZustand() {
  if (S.sk2 && typeof S.sk2 === 'object') return S.sk2;
  const alt = S.sk || {}, neu = { plan: 'kaktus', tree: 'kaktus', buys: {}, own: { base: { kaktus: 0, seele: 0, forschung: 0 }, pts: {} }, sel: null };
  if (alt.mode) neu.plan = alt.mode === 'custom' ? 'own' : alt.mode;
  if (alt.skt && BAUM[alt.skt]) neu.tree = alt.skt;
  if (alt.buys && typeof alt.buys === 'object') for (const [k, v] of Object.entries(alt.buys)) if (PLAENE[k]) neu.buys[k] = Math.max(0, Math.min(TAL.maxBuy, +v || 0));
  const altKey = { kaktus: 'mc', seele: 'ms', forschung: 'mf' };
  for (const t of TAL.trees) {
    const box = alt[altKey[t.id]] || {};
    for (const n of t.nodes) { const v = +box[n.legacyPos] || 0; if (v > 0 && !n.locked) neu.own.pts[t.id + ':' + n.id] = Math.min(v, n.max); }
  }
  const spent = t => TAL.trees.find(x => x.id === t).nodes.reduce((a, n) => a + (neu.own.pts[t + ':' + n.id] || 0), 0);
  for (const t of TAL.trees) neu.own.base[t.id] = alt.mp && alt.mp[t.id] != null ? Math.max(+alt.mp[t.id] || 0, spent(t.id)) : spent(t.id);
  const sum = Object.values(neu.own.base).reduce((a, b) => a + b, 0);
  if (alt.buy != null && +alt.buy > sum) neu.own.base.kaktus += Math.min(TAL.maxBuy, +alt.buy) - sum;
  S.sk2 = neu; return neu;
}

/* ---------- Rechnen ---------- */
function fuehrung(Z) {          // Anleitung aktiv? Sonst zeigt ein Plan immer den fertigen Baum
  if (!Z.guide) { Z.guide = {}; for (const [k, v] of Object.entries(Z.buys || {})) if (v < TAL.maxBuy) Z.guide[k] = true; }
  return Z.plan !== 'own' && !!Z.guide[Z.plan];
}
const kaufe = Z => (Z.plan === 'own' ? Object.values(Z.own.base).reduce((a, b) => a + b, 0) : fuehrung(Z) ? (Z.buys[Z.plan] || 0) : TAL.maxBuy);
/* Reihenfolge zum Skillen: Talente, die in dieser Season nichts bringen („funktioniert nicht“), kommen ans Ende –
   außer ein späteres Talent braucht sie als Voraussetzung. Die übrigen Punkte (Basis-Talent) kommen davor. */
function vorgaenger(tree, id, seen = new Set()) {
  for (const r of KNOTEN[tree + ':' + id].req) if (!seen.has(r)) { seen.add(r); vorgaenger(tree, r, seen); }
  return seen;
}
const SKILLFOLGE = {};
function folge(planId) {
  if (SKILLFOLGE[planId]) return SKILLFOLGE[planId];
  const P = PLAENE[planId], gut = [], spaeter = [];
  for (const e of P.order) {
    if (KNOTEN[e[0] + ':' + e[1]].broken) { spaeter.push(e); continue; }
    const brauch = vorgaenger(e[0], e[1]);
    for (let i = 0; i < spaeter.length;) { if (spaeter[i][0] === e[0] && brauch.has(spaeter[i][1])) gut.push(...spaeter.splice(i, 1)); else i++; }
    gut.push(e);
  }
  const len = P.order.reduce((a, x) => a + x[2], 0), rest = Math.max(0, TAL.maxBuy - len);
  return (SKILLFOLGE[planId] = [...gut, ...(rest && P.extra ? [[P.extra, null, rest]] : []), ...spaeter]);
}
function planVerteilung(planId, y) {
  const P = PLAENE[planId], out = { kaktus: {}, seele: {}, forschung: {} }; let rest = y, extra = 0;
  for (const [t, id, n] of folge(planId)) { if (rest <= 0) break; const k = Math.min(n, rest); if (id) out[t][id] = (out[t][id] || 0) + k; else extra += k; rest -= k; }
  return { out, extra: extra + Math.max(0, rest), extraBaum: P.extra };
}
function planSchritt(planId, index) {       // welcher Knoten bekommt den Punkt Nr. index (0-basiert)? id null = Basis-Talent
  let i = index;
  for (const [t, id, n] of folge(planId)) { if (i < n) return { tree: t, id }; i -= n; }
  return null;

    <div class="box"><h2>Deine Punkte</h2><p class="muted small" style="margin:-4px 0 12px">Trag deine Level ein – die verfügbaren Punkte werden ausgerechnet.</p><div class="atsrc">${quellen}</div>
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-weight:700"><span>Berechnet</span><span>${zahl(B.calc)} Punkte</span></div>
      <div class="atsrc" style="margin-top:10px"><label for="at-total">Gesamtpunkte laut Spiel<small>optional – überschreibt die Berechnung</small></label><input class="inp" id="at-total" inputmode="numeric" data-in="atsrc" data-k="total" value="${S.at.src.total || ''}" placeholder="–"><span></span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px"><button type="button" class="btn soft" data-do="atReset" data-v="p">Punkte zurücksetzen</button><button type="button" class="btn soft" data-do="atReset" data-v="src">Level leeren</button></div></div>
    <p class="muted small" style="margin-top:14px">${html(ATT.note)} Klick auf ein Symbol zeigt die Details, Shift + Klick auf − / + ändert um 10. „ungefähr“ heißt: Das Wiki nennt keine genaue Formel – angezeigt wird der Bereich, der sich aus den bekannten Werten sicher ergibt.</p>`;
};
</script>
<script>/* CactusClicker S8 Checkliste – Steuerung: Navigation, Aktionen, Eingaben, Suche, Start */
'use strict';

/* ---------- Navigation ---------- */
const ALT_ZIELE = { dash: 'start', esscheck: 'ess', 'ess-list': 'ess', 'ess-plan': 'ess', late: 'sets' };
function geheZu(view, scrollBleibt) {
  if (view === 'esscheck') S.ui.essMode = 'check';
  if (view === 'ess-list') S.ui.essMode = 'list';
  if (view === 'ess-plan') S.ui.essMode = 'plan';
  if (view === 'late') { S.ui.set = 'dmg'; S.ui.stage.dmg = 'late'; }
  view = ALT_ZIELE[view] || view;
  if (!VIEWS[view]) view = 'start';
  S.ui.view = view; sichern();
  if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
  document.body.classList.remove('menu');
  zeichne();
  if (!scrollBleibt) window.scrollTo(0, 0);
}
const FORTSCHRITT_NAV = { run: 'run', fab: 'fab', ess: 'ess', sets: 'sets', swords: 'swords', asp: 'asp', bp: 'bp', fish: 'fish' };
function leiste() {
  const nav = BEREICHE.map(g => `<div class="navgrp"><h6>${html(g.grp)}</h6><ul>${g.items.map(([id, l]) => {
    let mini = ''; if (FORTSCHRITT_NAV[id]) { const s = stand(FORTSCHRITT_NAV[id]); if (s.d > 0) mini = `<span class="mini${s.t && s.d === s.t ? ' full' : ''}">${s.t && s.d === s.t ? '✓' : Math.max(1, Math.round(s.p)) + '%'}</span>`; }
    return `<li><a class="nav" href="#${id}" data-do="go" data-v="${id}"${S.ui.view === id ? ' aria-current="page"' : ''}>${sym(id)}<span class="t">${html(l)}</span>${mini}</a></li>`; }).join('')}</ul></div>`).join('');
  qs('#railNav').innerHTML = nav;
  qs('#crumb').innerHTML = `${sym(S.ui.view)}<span>${html(SEITEN[S.ui.view] || '')}</span><small>· ${html(gruppeVon(S.ui.view))}</small>`;
  qs('#dock').innerHTML = DOCK.map(([id, l]) => `<button type="button" data-do="go" data-v="${id}"${S.ui.view === id ? ' aria-current="page"' : ''}>${sym(id)}<span>${l}</span></button>`).join('') +
    `<button type="button" data-do="menu"${DOCK.some(d => d[0] === S.ui.view) ? '' : ' aria-current="page"'}>${sym('mehr')}<span>Mehr</span></button>`;
}
function zeichne() {
  const a = document.activeElement, fid = a && a.id, auswahl = a && 'selectionStart' in a ? [a.selectionStart, a.selectionEnd] : null;
  leiste();
  qs('#page').innerHTML = (VIEWS[S.ui.view] || VIEWS.start)();
  skinMalen();
  if (fid) { const n = document.getElementById(fid); if (n && n !== document.body) { n.focus({ preventScroll: true }); if (auswahl) try { n.setSelectionRange(auswahl[0], auswahl[1]); } catch (e) {} } }
}
const neu = () => { sichern(); zeichne(); };

/* ---------- Springen zu Einträgen ---------- */
function markiere(sel, fehltText) {
  requestAnimationFrame(() => {
    const el = document.querySelector(sel);
    if (!el) { if (fehltText) meldung(fehltText); return; }
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add(el.classList.contains('node') ? 'pulse' : 'flash');
  });
}
function springe(id, matsAuf) {
  const r = REG[id]; if (!r) return;
  if (r.ziel) { if (r.ziel.set) S.ui.set = r.ziel.set; if (r.ziel.stage) S.ui.stage[r.ziel.set] = r.ziel.stage; if (r.ziel.aspMode) S.ui.aspMode = r.ziel.aspMode; }
  if (r.grp) delete S.ui.closed[r.grp];
  for (const k of Object.keys(S.ui.q)) S.ui.q[k] = '';
  for (const k of Object.keys(S.ui.f)) S.ui.f[k] = 'all';
  if (matsAuf) S.ui.open[r.base || id] = true;
  geheZu(r.view, true);
  markiere(`[data-row="${CSS.escape(r.base || id)}"]`);
}

/* ---------- Zurücksetzen ---------- */
async function weg(liste, was) {
  if (!await frage(`${was} wirklich zurücksetzen?\nDie Haken (und Material-Haken) werden entfernt.`)) return;
  const m = new Set(liste);
  for (const k of Object.keys(S.checks)) { const b = k.split('::m::')[0]; if (m.has(k) || m.has(b)) delete S.checks[k]; }
  S.log = S.log.filter(l => !m.has(l.id)); neu(); meldung(`${was} zurückgesetzt.`);
}
async function zuruecksetzen(art) {
  const SET = INH.sets.find(x => x.id === S.ui.set) || INH.sets[0];
  const T = {
    stage: () => { const g = aktStufe(SET); return [g.items.flatMap(x => varianten(SET, x).map(v => v.id)), `${SET.title} [${g.label}]`]; },
    sets: () => [ids('sets'), 'Alle Ausrüstungssets'], swords: () => [INH.swords.map(x => x.id), 'Schwerter'],
    'asp-ac': () => [INH.aspects.ac.map(x => x.id), 'AC-Aspekte'], 'asp-boss': () => [INH.aspects.bosses.map(x => x.id), 'Boss-Aspekte'], 'asp-waves': () => [INH.aspects.waves.map(x => x.id), 'Wellen-Aspekte'],
    bp: () => [FORTSCHRITT.bp(), 'Baupläne'], gear: () => [INH.lateGear.map(x => x.id), 'Endgame-Ausrüstung'], fab: () => [FORTSCHRITT.fab(), 'Fabriklevel'],
    run: () => [FORTSCHRITT.run(), 'Speedrun'], fish: () => [ids('fish'), 'Angeln']
  };
  if (art.startsWith('block:')) { const B = INH.lateBlocks.blocks.find(b => b.id === art.slice(6)); if (B) return weg([...B.crafts.flatMap(c => [c.id, ...c.resources.map(r => r.id)]), ...B.totals.flat().map(r => r.id), ...(B.fill ? B.fill.items.map(x => x.id) : [])], B.title); return; }
  if (art === 'ess') {
    if (!await frage('Alle eingetragenen Essenz-Mengen wirklich zurücksetzen?')) return;
    S.amt = {}; S.log = S.log.filter(l => !l.id.startsWith('ess.')); neu(); return meldung('Essenz-Mengen zurückgesetzt.');
  }
  if (T[art]) { const [l, w] = T[art](); return weg(l, w); }
}

/* ---------- Aktionen (data-do) ---------- */
function essMerken(id, wert) { const m = id.match(/^ess\.(.*)\.(\d+)$/); REG[id] = REG[id] || { t: `${m[1]} T${m[2]}`, s: 'Essenz-Checkliste', view: 'ess', art: 'ess' }; merke(id, wert); }
const AKTION = Object.assign({
  tick(el) { const k = el.dataset.k; setze(k, !an(k)); },
  essDone(el) { const e = essenzen().find(x => x.id === el.dataset.k); if (!e) return; if (e.fertig) delete S.amt[e.id]; else S.amt[e.id] = e.brauche; essMerken(e.id, !e.fertig); },
  pick(el) {
    const f = el.dataset.f, v = el.dataset.v;
    if (f.startsWith('f.')) S.ui.f[f.slice(2)] = v; else if (f.startsWith('stage.')) S.ui.stage[f.slice(6)] = v; else S.ui[f] = v;
  },
  mats(el) { const k = el.dataset.k; if (S.ui.open[k]) delete S.ui.open[k]; else S.ui.open[k] = true; },
  fold(el) { const k = el.dataset.k; if (S.ui.closed[k]) delete S.ui.closed[k]; else S.ui.closed[k] = true; },
  jump(el) { springe(el.dataset.k); return 'stop'; },
  go(el) { if (el.dataset.ui) for (const p of el.dataset.ui.split(';')) { const [k, v] = p.split('='); if (k === 'stage') S.ui.stage[S.ui.set] = v; else S.ui[k] = v; } geheZu(el.dataset.v); return 'stop'; },
  journey(el) { S.ui.hideJourney = el.dataset.v === 'hide'; },
  journeyGo(el) { const z = REISE[+el.dataset.v]; if (!z) return 'stop'; const ui = z.ziel.ui || {}; if (ui.set) S.ui.set = ui.set; if (ui.stage) S.ui.stage[ui.set] = ui.stage; if (ui.essMode) S.ui.essMode = ui.essMode; geheZu(z.ziel.view); return 'stop'; },
  fabAll() { for (const x of INH.fabrik.levels) if (x.level <= S.ui.fl && !an(x.id)) setze(x.id, true); meldung('Freischaltungen abgehakt.'); },
  reset(el) { zuruecksetzen(el.dataset.k); return 'stop'; },
  atStep(el, ev) { const id = el.dataset.k, d = +el.dataset.v * (ev.shiftKey && Math.abs(+el.dataset.v) === 1 ? 10 : 1), v = Math.max(0, Math.min(99999, (S.at.p[id] || 0) + d)); S.ui.atSel = id; if (v) S.at.p[id] = v; else delete S.at.p[id]; },
  atSel(el) { S.ui.atSel = el.dataset.k; },
  async atReset(el) { const k = el.dataset.v; if (!await frage(k === 'p' ? 'Alle verteilten Attributpunkte zurücksetzen?' : 'Alle eingetragenen Level leeren?')) return 'stop'; S.at[k] = {}; },
  theme() {
    const hell = document.documentElement.dataset.theme !== 'light';
    if (hell) document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem(THEMA, hell ? 'light' : 'dark'); } catch (e) {}
    themaFarbe(); meldung(hell ? 'Heller Modus' : 'Dunkler Modus'); themaKnopf(); return 'stop';
  },
  find() { sucheAuf(); return 'stop'; },
  menu() { document.body.classList.toggle('menu'); return 'stop'; },
  close() { sucheZu(); return 'stop'; }
}, TALENT_AKTION, ANZIEHEN);
document.addEventListener('click', async ev => {
  if (document.body.classList.contains('menu') && !ev.target.closest('.rail') && !ev.target.closest('[data-do="menu"]')) { document.body.classList.remove('menu'); return; }
  const el = ev.target.closest('[data-do]'); if (!el || el.disabled) { if (ev.target.id === 'finderOv') sucheZu(); return; }
  const fn = AKTION[el.dataset.do]; if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault();
  const r = await fn(el, ev);
  if (r !== 'stop') neu();
});

/* ---------- Eingaben (data-in) ---------- */
let wartet;
document.addEventListener('input', ev => {
  const t = ev.target, art = t.dataset && t.dataset.in;
  if (t.id === 'findQ') return sucheLaeuft();
  if (!art) return;
  const k = t.dataset.k;
  if (art === 'q') { S.ui.q[k] = t.value; neu(); return; }
  if (art === 'atsrc' || art === 'atp') {
    t.value = t.value.replace(/\D/g, ''); const v = Math.min(99999, Math.floor(+t.value) || 0), box = art === 'atsrc' ? S.at.src : S.at.p;
    if (v) box[k] = v; else delete box[k];
    clearTimeout(wartet); wartet = setTimeout(neu, 300); return;
  }
  if (art === 'num') {
    t.value = t.value.replace(/\D/g, ''); const v = Math.floor(+t.value);
    clearTimeout(wartet);
    wartet = setTimeout(() => {
      if (k === 'mk') S.ui.mk = v >= 1 ? Math.min(v, 9999) : 1;
      else if (k === 'wave') S.ui.wave = v > 0 ? v : null;
      else if (k === 'lvl') S.ui.lvl = v > 0 ? Math.min(v, 999) : null;
      else if (k === 'fl') S.ui.fl = v > 0 ? Math.min(v, 9999) : null;
      else S.ui[k] = v >= ERST ? Math.min(v, LETZT) : null;
      neu();
    }, 250);
  }
});
document.addEventListener('change', ev => {
  const t = ev.target, art = t.dataset && t.dataset.in; if (!art) return;
  const k = t.dataset.k;
  if (art === 'sort') { S.ui.s[k] = t.value; neu(); }
  else if (art === 'ui') { S.ui[k] = isNaN(+t.value) ? t.value : +t.value; neu(); }
  else if (art === 'amt') { const v = menge(t.value); if (v) S.amt[k] = v; else delete S.amt[k]; const e = essenzen().find(x => x.id === k); if (e) essMerken(e.id, e.fertig); neu(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { sucheZu(); document.body.classList.remove('menu'); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); sucheAuf(); }
  if (ev.key === 'Enter' && ev.target.id === 'findQ') { const b = qs('#findRes .hit'); if (b) b.click(); }
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.in === 'amt') ev.target.blur();
});

/* ---------- Suche über alles ---------- */
const INDEX = [];
(function aufbauen() {
  for (const [id, r] of Object.entries(REG)) if (r.art !== 'late-total') INDEX.push({ t: r.t, s: r.s, g: SEITEN[r.view] || 'Start', id, run: () => springe(id) });
  const schon = new Set();
  FOLGE.forEach(k => { if (schon.has(k)) return; schon.add(k); const m = k.match(/^(.*?)(\d+)$/), id = `ess.${m[1]}.${m[2]}`;
    INDEX.push({ t: `${m[1]} T${m[2]}`, s: `Essenz · beste Welle ${zahl(WELLE[k])}`, g: 'Essenzen', ess: id, run: () => {
      S.ui.essMode = 'check'; S.ui.f.ess = 'all'; S.ui.q.ess = ''; S.ui.essTier = 0; S.ui.wave = null; geheZu('ess', true);
      markiere(`[data-row="${CSS.escape(id)}"]`, 'Diese Essenz liegt außerhalb deines Level-Bereichs (Von/Bis Level).'); } }); });
  const erst = {};
  for (const [id, r] of Object.entries(REG)) { if (!r.item) continue; const it = r.item, c = kosten(it.name || it.item, it.level ?? ''); if (!c) continue; const k = c.l + '|' + (c.t || it.name || it.item); if (!erst[k]) erst[k] = { id, c, n: it.display || it.name || it.item }; }
  const mats = {};
  for (const { id, c, n } of Object.values(erst)) for (const m of c.m) { const name = m.replace(/^\d+\s+/, ''); (mats[name] = mats[name] || []).push({ id, n, m }); }
  for (const [name, L] of Object.entries(mats)) for (const x of L) INDEX.push({ t: name, s: `Material für ${x.n} (${/^\d/.test(x.m) ? x.m.match(/^\d+/)[0] + ' Stück' : 'Menge nicht angegeben'})`, g: 'Materialien', run: () => springe(x.id, true) });
  for (const w of INH.widget) INDEX.push({ t: 'Widget: ' + w.name, s: `Spalte ${w.col || '–'} · Reihe ${w.row || '–'}`, g: 'Speedrun 1. MK', run: () => { delete S.ui.closed['run.widget']; geheZu('run'); markiere('#widget'); } });
  INDEX.push(...talentSuche());
  for (const x of ATT.list) INDEX.push({ t: x.name, s: x.effect, g: 'Attribute', run: () => { S.ui.atSel = x.id; geheZu('attr'); } });
  for (const r of INH.acLevels) INDEX.push({ t: `AC-Ebene ${r[0]}: ${r[1]}`, s: `${zahl(r[2])} HP · Portalcount ${zahl(r[3])}`, g: 'AC-Ebenen', run: () => { S.ui.q.aclv = String(r[1]); geheZu('aclv'); } });
})();
function hervor(text, q) { const s = html(text); if (!q) return s; const i = flach(text).indexOf(q); return i < 0 ? s : html(text.slice(0, i)) + '<mark>' + html(text.slice(i, i + q.length)) + '</mark>' + html(text.slice(i + q.length)); }
let TREFFER = [];
function sucheLaeuft() {
  const q = flach(qs('#findQ').value.trim()), box = qs('#findRes');
  if (q.length < 2) { box.innerHTML = '<p class="muted small" style="padding:10px 12px">Mindestens 2 Zeichen – durchsucht Gegenstände, Essenzen, Materialien, Schwerter, Aspekte, Baupläne, Talente, AC-Ebenen und mehr.</p>'; return; }
  TREFFER = INDEX.filter(x => flach(x.t + ' ' + x.s).includes(q)).sort((a, b) => (flach(a.t).startsWith(q) ? 0 : 1) - (flach(b.t).startsWith(q) ? 0 : 1));
  if (!TREFFER.length) { box.innerHTML = '<p class="muted" style="padding:10px 12px">Nichts gefunden.</p>'; return; }
  const gr = {}; TREFFER.forEach((h, i) => { h.i = i; (gr[h.g] = gr[h.g] || []).push(h); });
  box.innerHTML = Object.entries(gr).map(([g, L]) => `<h5>${html(g)} · ${L.length}</h5>${L.slice(0, 30).map(h => {
    const pip = h.id ? `<span class="pip${an(h.id) ? ' on' : ''}"></span>` : h.ess ? `<span class="pip${(essenzen().find(e => e.id === h.ess) || {}).fertig ? ' on' : ''}"></span>` : '<span class="pip"></span>';
    return `<button type="button" class="hit" data-hit="${h.i}">${pip}<span><b>${hervor(h.t, q)}</b><small>${hervor(h.s, q)}</small></span></button>`; }).join('')}${L.length > 30 ? `<p class="muted small" style="padding:2px 10px">… und ${L.length - 30} weitere – genauer suchen.</p>` : ''}`).join('');
}
qs('#findRes').addEventListener('click', ev => { const b = ev.target.closest('[data-hit]'); if (!b) return; const h = TREFFER[+b.dataset.hit]; sucheZu(); if (h) h.run(); });
function sucheAuf() { const o = qs('#finderOv'); o.hidden = false; document.body.style.overflow = 'hidden'; const i = qs('#findQ'); i.focus(); i.select(); sucheLaeuft(); }
function sucheZu() { const o = qs('#finderOv'); if (o) o.hidden = true; document.body.style.overflow = ''; }

/* ---------- Thema & Links ---------- */
function themaFarbe() { const m = qs('meta[name=theme-color]'); if (m) m.content = document.documentElement.dataset.theme === 'light' ? '#eef2f6' : '#0b1330'; }
function themaKnopf() { const hell = document.documentElement.dataset.theme === 'light'; qs('#themeBtn').innerHTML = `${sym(hell ? 'mond' : 'sonne')}<span>${hell ? 'Dunkler Modus' : 'Heller Modus'}</span>`; }
const SOZIAL = (function links() {
  const L = INH.social || {};
  const tw = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.3 3 3 6.4v13.1h4.5V22h2.5l2.5-2.5h3.7l5-5V3H4.3Zm15.2 10.7-2.8 2.8h-4.5L9.8 19v-2.5H6V4.8h13.5v8.9ZM16.7 7.6V12h-1.6V7.6h1.6Zm-4.3 0V12h-1.6V7.6h1.6Z"/></svg>';
  const dc = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.3 5.3A16.6 16.6 0 0 0 15.2 4l-.5 1a15.4 15.4 0 0 0-5.4 0l-.5-1a16.6 16.6 0 0 0-4.1 1.3C2.1 9.2 1.4 13 1.7 16.7a16.7 16.7 0 0 0 5 2.5l1-1.6c-.6-.2-1.1-.5-1.6-.8l.4-.3a11.9 11.9 0 0 0 10.2 0l.4.3c-.5.3-1 .6-1.6.8l1 1.6a16.6 16.6 0 0 0 5-2.5c.4-4.3-.7-8.1-3.2-11.4ZM8.7 14.5c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/></svg>';
  qs('#soc').innerHTML = (L.twitch ? `<a class="tw" href="${html(L.twitch)}" target="_blank" rel="noopener noreferrer" title="Twitch: screamingblatz">${tw}Twitch</a>` : '') +
    (L.discord ? `<a class="dc" href="${html(L.discord)}" target="_blank" rel="noopener noreferrer" title="Zum Discord-Server">${dc}Discord</a>` : '');
  return qs('#soc').innerHTML;
})();

/* ---------- Start ---------- */
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.ui.view) geheZu(h); });
window.addEventListener('storage', ev => { if (ev.key === SPEICHER) { S = laden(); zeichne(); } });
themaFarbe(); themaKnopf();
{ const h = location.hash.slice(1); if (h && (VIEWS[h] || ALT_ZIELE[h])) S.ui.view = h; geheZu(S.ui.view, true); }
</script>
