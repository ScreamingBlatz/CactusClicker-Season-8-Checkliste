<style>
/* CactusClicker S8 Checkliste – Styles */
:root{
  --bg:#0b1018; --bg2:#0f1520; --surface:#141c28; --surface2:#19222f; --surface3:#202b3a;
  --line:#243041; --line2:#2e3c50;
  --ink:#e8eef6; --ink2:#c4cfdd; --muted:#8a99ad; --faint:#5d6b7e;
  --accent:#4fb3ff; --accent2:#3a93d6; --accent-ink:#04101c; --accent-soft:rgba(79,179,255,.13);
  --warn:#ff6b5e; --warn-soft:rgba(255,107,94,.13); --gold:#f2b84b;
  --r-c:#a6b0bc; --r-g:#62c45b; --r-b:#5b8cff; --r-p:#a768ea; --r-o:#f39c1d; --r-n:#6b788a; --r-u:#6b788a;
  --radius:14px; --radius-s:10px;
  --shadow:0 10px 30px rgba(0,0,0,.4);
  --top-bg:rgba(11,16,24,.85); --tabs-bg:rgba(11,16,24,.92); --forge:#74d4e8; --stat:#a9d4ff; --cactus:#52d48c;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:radial-gradient(1200px 500px at 15% -10%,rgba(79,179,255,.07),transparent 60%),var(--bg);color:var(--ink);font:16px/1.5 var(--font);min-height:100vh}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.hidden{display:none!important}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Header & Tabs ---------- */
.top{background:var(--top-bg);border-bottom:1px solid var(--line)}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand b{display:block;white-space:nowrap;font-size:1.15rem;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:.8rem;margin-top:-2px}
.logo{width:40px;height:40px;padding:3px;border-radius:10px;background:var(--surface2);border:1px solid var(--line2);fill:var(--cactus);stroke:none}
.top-actions{display:flex;gap:8px;align-items:center}
.soc{display:contents}
.icon-btn{text-decoration:none}
.icon-btn.soc-tw{color:#bf94ff}.icon-btn.soc-tw:hover{border-color:#9146ff;color:#d7bdff}
.icon-btn.soc-dc{color:#8c9bff}.icon-btn.soc-dc:hover{border-color:#5865f2;color:#b3bcff}
.icon-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink2);font-size:.92rem;min-height:40px}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{border-color:var(--accent2);color:var(--ink)}
.tabs{position:sticky;top:0;z-index:20;background:var(--tabs-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs-inner{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;padding-bottom:10px}
.tab{text-decoration:none;border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.92rem;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{color:var(--ink);background:var(--surface)}
.tab[aria-current=page]{background:var(--accent);color:var(--accent-ink)}
.ts{display:none}
.tab .cnt{font-weight:500;opacity:.75;margin-left:4px;font-size:.8rem}

main.wrap{padding-top:24px;padding-bottom:30px;outline:none}
.foot{padding-bottom:40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:16px}
.foot p{margin:4px 0}

/* ---------- Typography / Page ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:16px}
.page-head h1{margin:0;font-size:1.55rem;letter-spacing:.2px}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
h2{font-size:1.15rem;margin:0}
h3{font-size:1rem;margin:0}
.section{margin:26px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:12px}
.grid.cats{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cat{display:block;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s;width:100%;color:var(--ink)}
.cat:hover{border-color:var(--accent2);transform:translateY(-1px)}
.cat .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat .t b{font-size:1rem}
.cat .t span{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.cat .s{color:var(--muted);font-size:.85rem;margin-top:8px;display:flex;justify-content:space-between}
.cat.done{border-color:rgba(79,179,255,.45)}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.3px}
.badge.gray{background:var(--surface3);color:var(--muted)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}

/* Hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding:22px}
.ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface3) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--surface)}
.ring div{position:relative;text-align:center}
.ring b{display:block;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.ring small{color:var(--muted);font-size:.8rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px}
.stat b{display:block;font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{color:var(--muted);font-size:.82rem}
.hero h1{margin:0 0 4px;font-size:1.4rem}
.hero p{margin:0 0 14px;color:var(--muted)}

/* Progress bars */
.bar{height:8px;border-radius:99px;background:var(--surface3);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .3s ease}
.bar.thin{height:5px;margin-top:6px}
.progress-line{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.92rem}
.progress-line b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin:14px 0}
.toolbar .grow{flex:1 1 200px}
.field{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.input,.select{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;min-height:40px;color:var(--ink);width:100%}
.input:focus,.select:focus{outline:2px solid var(--accent2);outline-offset:0;border-color:transparent}
.input.num{width:6.5em;text-align:right;font-variant-numeric:tabular-nums}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search .input{padding-left:34px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;min-height:34px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surface3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.seg.accent button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.9rem;color:var(--ink2);user-select:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent2);background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer;min-height:42px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--accent2)}
.btn.danger{background:transparent;color:var(--warn);border-color:rgba(255,107,94,.45)}
.btn.danger:hover{background:var(--warn-soft)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem;font-weight:600}
.btn-col{display:grid;gap:10px;margin:16px 0}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.88rem;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

/* ---------- Checkbox ---------- */
.cb{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);background:var(--bg2);cursor:pointer;display:inline-grid;place-items:center;transition:background .15s,border-color .15s;margin:0}
.cb:hover{border-color:var(--accent2)}
.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.cb.sm{width:19px;height:19px;border-radius:6px}
.cb.sm:checked::after{width:5px;height:9px}
.cb:focus-visible,button:focus-visible,a:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- List rows ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list-head{display:grid;gap:12px;padding:10px 16px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);background:var(--bg2)}
.row{display:grid;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);transition:background .15s}
.list-head+.row,.list>.row:first-child{border-top:0}
.row:hover{background:rgba(255,255,255,.015)}
.row.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.row.done .chip{opacity:.55}
.row.locked{opacity:.45}
.row.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:rgba(79,179,255,.22)}100%{background:transparent}}
.nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.nm small{display:block;font-weight:400;color:var(--muted);font-size:.84rem;text-decoration:none}
.lv{font-variant-numeric:tabular-nums;color:var(--ink2);text-align:center}
.lv small{display:none}
.r-set{grid-template-columns:24px 128px 56px minmax(0,1fr) auto}
.r-set2{grid-template-columns:auto 128px 56px minmax(0,1fr) auto}
.copies{display:flex;gap:6px}
.cpill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 5px;border:1px solid var(--line2);border-radius:999px;background:var(--bg2);font-size:.8rem;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;min-width:92px}
.cpill.on{border-color:var(--accent2);background:var(--accent-soft);color:var(--accent)}
.cpill.none{justify-content:center;color:var(--faint);cursor:default}
.list-head.r-set2 span:first-child{min-width:190px}
.r-sword{grid-template-columns:24px minmax(0,1.2fr) 56px minmax(0,1fr) minmax(0,1.2fr) auto}
.r-asp{grid-template-columns:24px 110px minmax(0,1fr) 56px minmax(0,1.2fr) minmax(0,1fr)}
.r-bp{grid-template-columns:24px minmax(0,1fr) 64px auto}
.r-ess{grid-template-columns:24px minmax(0,1fr) 70px 100px 128px 100px 90px}
.r-ro4{grid-template-columns:70px 100px minmax(0,1fr) 80px}
.r-ro3{grid-template-columns:minmax(0,1fr) 90px 90px}
.r-ac{grid-template-columns:70px minmax(0,1fr) 110px 120px}
.r-task{grid-template-columns:24px minmax(0,1fr)}
.r-boss{grid-template-columns:24px 100px minmax(0,.8fr) minmax(0,1fr) minmax(0,1.6fr)}
.r-fab{grid-template-columns:24px 70px minmax(0,1fr) minmax(0,.7fr)}
.r-task .badge{margin-left:6px;vertical-align:1px}
.r-plan{grid-template-columns:130px 150px minmax(0,1fr) minmax(0,1.3fr)}
.r-plan.now{background:var(--accent-soft)}
.r-blk{grid-template-columns:minmax(0,1fr) 170px 70px 150px}
.ink2{color:var(--ink2)}
.hide-d,.ml,.nm small.hide-d{display:none}

.num{text-align:right;font-variant-numeric:tabular-nums}
.ctr{text-align:center}
.miss{color:var(--warn);font-weight:600}
.okc{color:var(--accent)}
.warn-cell{color:var(--warn)}
.warn-cell::before{content:"● ";font-size:.7em;vertical-align:middle}

/* Rarity chip */
.chip{--cc:var(--r-n);display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:3px 11px 3px 9px;border-radius:999px;font-weight:600;font-size:.86rem;color:var(--ink);background:color-mix(in srgb,var(--cc) 15%,transparent);border:1px solid color-mix(in srgb,var(--cc) 50%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--cc)}
.chip.c{--cc:var(--r-c)}.chip.g{--cc:var(--r-g)}.chip.b{--cc:var(--r-b)}.chip.p{--cc:var(--r-p)}.chip.o{--cc:var(--r-o)}.chip.n,.chip.u{--cc:var(--r-n)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tier{display:inline-block;min-width:2.3em;text-align:center;font-size:.74rem;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:8px;background:var(--surface3);color:var(--ink2);vertical-align:1px}

/* Materials toggle & panel */
.mtog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface2);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.82rem;color:var(--ink2);white-space:nowrap}
.mtog:hover{border-color:var(--accent2)}
.mtog svg{width:14px;height:14px;transition:transform .2s}
.mtog[aria-expanded=true] svg{transform:rotate(180deg)}
.mtog.full{color:var(--accent);border-color:rgba(79,179,255,.4)}
.mpanel{grid-column:1/-1;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;margin:2px 0 4px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px}
.mpanel ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mpanel li label{display:flex;align-items:center;gap:10px;cursor:pointer}
.mpanel li.got span{color:var(--muted);text-decoration:line-through}
.mpanel dl{display:grid;grid-template-columns:auto auto;gap:3px 14px;margin:0;font-size:.88rem;align-content:start}
.mpanel dt{color:var(--muted)} .mpanel dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.mpanel .src{grid-column:1/-1;color:var(--faint);font-size:.78rem}

/* Notes */
.notes{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius-s);padding:12px 16px;margin-top:16px}
.notes h3{margin-bottom:6px;font-size:.95rem}
.notes ul,.notes ol{margin:0;padding-left:20px}
.notes li{margin:4px 0;color:var(--ink2)}
.callout{background:var(--warn-soft);border:1px solid rgba(255,107,94,.4);border-left:4px solid var(--warn);border-radius:var(--radius-s);padding:12px 16px;margin-top:16px}
.callout b{display:block}
.pending{border:1px dashed var(--line2);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* Groups (Baupläne / Tiers) */
.group{margin-bottom:16px}
.ghead{display:flex;width:100%;align-items:center;gap:12px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;cursor:pointer;color:var(--ink);text-align:left}
.ghead:hover{border-color:var(--line2)}
.ghead h2{display:flex;align-items:center;gap:10px}
.ghead svg{width:18px;height:18px;transition:transform .2s;color:var(--muted)}
.ghead[aria-expanded=false] svg{transform:rotate(-90deg)}
.ghead .gmeta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.ghead .gmeta .bar{width:90px;margin:0}
.group[data-gopen=true] .ghead{border-bottom-left-radius:0;border-bottom-right-radius:0}
.group[data-gopen=true] .list{border-top:0;border-top-left-radius:0;border-top-right-radius:0}
.tierhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:22px 0 8px;padding-left:12px;border-left:4px solid var(--accent)}

.tierhead.t1{border-color:#5fbf5a}.tierhead.t2{border-color:#4f93e8}.tierhead.t3{border-color:#a768ea}.tierhead.t4{border-color:#f39c1d}.tierhead.t5{border-color:#e85d8a}.tierhead.t6{border-color:#2ec4b6}
.tier.t1{background:rgba(95,191,90,.18);color:#7fd67a}.tier.t2{background:rgba(79,147,232,.18);color:#7fb2f2}.tier.t3{background:rgba(167,104,234,.18);color:#c39af2}.tier.t4{background:rgba(243,156,29,.18);color:#f5b552}.tier.t5{background:rgba(232,93,138,.18);color:#f08aaa}.tier.t6{background:rgba(46,196,182,.18);color:#5fd8cc}
html[data-theme=light] .tier.t1{color:#2f8a2a}html[data-theme=light] .tier.t2{color:#245fc0}html[data-theme=light] .tier.t3{color:#7a3ac6}html[data-theme=light] .tier.t4{color:#b56a00}html[data-theme=light] .tier.t5{color:#c23a66}html[data-theme=light] .tier.t6{color:#178a80}
.tierhead span{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}

/* Essence row extras */
.amt-in{width:100%;text-align:right;font-variant-numeric:tabular-nums;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;min-height:36px}
.amt-in:focus{outline:2px solid var(--accent2);border-color:transparent}
.pct{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);text-align:right}
.pct .bar{margin-top:4px}
.ess-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}

/* Late game gear cards */
.gear{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.gcard{position:relative;background:linear-gradient(180deg,rgba(167,104,234,.07),transparent 40%),var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.gcard.done{opacity:.6}
.gcard .gtop{display:flex;align-items:flex-start;gap:12px}
.gcard h3{font-size:1.02rem;line-height:1.3}
.gcard h3 .up{color:var(--r-p);margin-right:4px}
.gcard .meta{color:var(--muted);font-size:.84rem}
.gcard .forge{color:var(--forge);font-size:.82rem;font-weight:600}
.gcard ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:.9rem;font-variant-numeric:tabular-nums}
.gcard li{color:var(--stat)}
.gcard .asp{margin-top:8px;font-size:.88rem;color:var(--gold)}
.gcard .score{margin-left:auto;text-align:right;font-size:.8rem;color:var(--muted);white-space:nowrap}
.gcard .score b{display:block;color:var(--ink);font-size:1.05rem}

/* Craft cards */
.crafts{display:grid;gap:12px}
.craft{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.craft.done{border-color:rgba(79,179,255,.4)}
.craft-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between}
.craft-head h3{font-size:1.02rem}
.craft-head .sub{color:var(--muted);font-size:.86rem}
.craft-body{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:14px 24px;margin-top:12px}
.mods{display:flex;flex-wrap:wrap;gap:6px}
.mods span{background:var(--surface3);border:1px solid var(--line2);border-radius:7px;padding:2px 8px;font-size:.82rem;color:var(--ink2)}
.reslist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.reslist label{display:flex;gap:10px;align-items:center;cursor:pointer;font-variant-numeric:tabular-nums}
.reslist li.got span{color:var(--muted);text-decoration:line-through}
.lbl-k{display:block;color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

/* Ponds */
.ponds{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pond h3{display:flex;align-items:center;gap:10px}
.pond .bio{color:var(--muted);font-size:.84rem;margin:2px 0 10px 32px}
.pond .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.88rem}
.pond ul{margin:0;padding-left:16px;color:var(--ink2)}
.pond.done{border-color:rgba(79,179,255,.4)}
.info-list{counter-reset:i;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.info-list li{counter-increment:i;display:grid;grid-template-columns:30px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;color:var(--ink2)}
.info-list li::before{content:counter(i);display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:.85rem}
.aspcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.aspcards .card b{display:block;margin-bottom:4px;color:var(--gold)}
.aspcards .card p{margin:0;color:var(--ink2);font-size:.92rem}

/* Startpfad */
.start{margin-top:0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface2)}
.steps li.cur{border-color:var(--accent2);background:var(--accent-soft)}
.steps li.ok{opacity:.65}
.steps .no{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface3);font-weight:800;color:var(--ink2)}
.steps li.cur .no{background:var(--accent);color:var(--accent-ink)}
.steps li.ok .no{background:var(--accent-soft);color:var(--accent)}
.steps p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.steps li.mkstep .no{background:rgba(167,104,234,.2);color:#c39af2}
.steps .chk.st{gap:6px}
.steps .st{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:700px){.steps li{grid-template-columns:30px minmax(0,1fr) auto}.steps .st{grid-column:2;grid-row:2}.steps .btn{grid-column:3;grid-row:1/3}}

/* Dashboard lists */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.mini li:first-child{border-top:0}
.mini .where{color:var(--muted);font-size:.8rem;display:block}
.mini .go{background:none;border:0;color:var(--ink);text-align:left;cursor:pointer;padding:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.mini .go:hover{color:var(--accent)}
.mini time{color:var(--faint);font-size:.8rem;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--accent)}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(3,6,5,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:8vh 14px 14px}
.overlay[hidden]{display:none}
.sheet{width:100%;max-width:680px;max-height:84vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sheet.small{max-width:440px}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1}
.sheet-head>svg{width:20px;height:20px;color:var(--muted);flex:none}
.sheet-head input{flex:1;border:0;background:transparent;font-size:1.05rem;padding:8px 4px;outline:none;min-width:0}
.sheet-body{overflow:auto;padding:6px 0}
.sheet-body.pad{padding:16px 18px}
.res-group{padding:6px 0}
.res-group h4{margin:8px 16px 4px;font-size:.76rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.res{display:flex;width:100%;align-items:center;gap:12px;padding:9px 16px;background:none;border:0;text-align:left;cursor:pointer;color:var(--ink)}
.res:hover,.res:focus{background:var(--surface2);outline:none}
.res .rt{flex:1;min-width:0}
.res .rt b{font-weight:600;display:block;overflow-wrap:anywhere}
.res .rt small{color:var(--muted)}
.res mark{background:rgba(79,179,255,.25);color:inherit;border-radius:3px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--surface3);border:1px solid var(--line2);color:var(--ink);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:.92rem;max-width:calc(100% - 28px)}

/* ---------- Responsive ---------- */
@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .craft-body{grid-template-columns:1fr}
  .r-sword{grid-template-columns:24px minmax(0,1fr) auto}
  .r-sword .c-anvil,.r-sword .c-notes{grid-column:2/-1}
  .r-sword .lv{display:none}
  .r-asp{grid-template-columns:24px minmax(0,1fr) auto}
  .r-asp .c-part{display:none}
  .r-asp .nm small.hide-d{display:block}
  .r-asp .c-item,.r-asp .c-range{grid-column:2/-1}
  .r-boss{grid-template-columns:24px minmax(0,1fr)}
  .r-boss .c-part,.r-boss .c-item{display:none}
  .r-boss .nm small.hide-d{display:block}
  .r-boss .c-range{grid-column:2/-1}
  .list-head.r-boss{display:none}
  .list-head.h-sword,.list-head.h-asp{display:none}
}
@media (max-width:700px){
  .wrap{padding:0 12px}
  html{scroll-padding-top:70px}
  .brand small{display:none}
  .icon-btn .lbl{display:none}
  .icon-btn{padding:7px 8px;min-height:36px}
  .top-actions{gap:5px}
  .logo{width:36px;height:36px;padding:2px}
  .brand{gap:8px}
  .brand b{font-size:1rem}
  .tabs-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding-top:7px;padding-bottom:7px}
  .tab{justify-content:center;padding:7px 4px;font-size:.8rem;border:1px solid var(--line);background:var(--surface);min-width:0}
  .tab[aria-current=page]{border-color:var(--accent)}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center;padding:18px}
  .hero .stats{width:100%}
  .ring{width:130px;height:130px}
  .page-head h1{font-size:1.3rem}
  .row{padding:11px 12px;gap:8px 10px}
  .list-head{display:none}
  .r-set{grid-template-columns:24px minmax(0,1fr) auto}
  .r-set .c-part{grid-column:2;grid-row:1}
  .r-set .lv{grid-column:3;grid-row:1}
  .r-set .nm{grid-column:2/-1}
  .r-set .c-mat{grid-column:2/-1;justify-self:start}
  .r-set2{grid-template-columns:minmax(0,1fr) auto}
  .r-set2 .c-part{grid-column:1;grid-row:1}
  .r-set2 .lv{grid-column:2;grid-row:1}
  .r-set2 .nm{grid-column:1/-1;grid-row:2}
  .r-set2 .copies{grid-column:1/-1;grid-row:3}
  .r-set2 .c-mat{grid-column:1/-1;grid-row:4;justify-self:start}
  .r-set2 .mpanel{grid-row:5}
  .lv small{display:inline;color:var(--muted)}
  .r-bp{grid-template-columns:24px minmax(0,1fr) auto}
  .r-fab{grid-template-columns:24px minmax(0,1fr) auto}
  .r-fab .lv{grid-column:3;grid-row:1}
  .r-fab .nm{grid-column:2;grid-row:1}
  .r-fab .c-cost{grid-column:2/-1}
  .r-bp .c-mat{grid-column:2/-1;justify-self:start}
  .r-ess{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr)}
  .r-ess .nm{grid-column:2/-1}
  .r-ess .c-wave,.r-ess .c-need,.r-ess .c-miss{grid-column:auto;text-align:left;font-size:.88rem}
  .r-ess .c-wave{grid-column:2}
  .r-ess .c-need{grid-column:3}
  .r-ess .c-in{grid-column:2}
  .r-ess .c-miss{grid-column:3}
  .r-ess .pct{grid-column:2/-1;text-align:left}
  .r-ess [data-l]::before{content:attr(data-l) " ";color:var(--muted)}
  .r-ro4{grid-template-columns:50px 80px minmax(0,1fr) 60px;font-size:.92rem}
  .r-ac{grid-template-columns:44px minmax(0,1fr) 80px 76px;font-size:.9rem}
  .r-plan{grid-template-columns:1fr 1fr}
  .r-plan>span:nth-child(3),.r-plan>span:nth-child(4){grid-column:1/-1}
  .ml{display:inline}
  .r-blk{grid-template-columns:minmax(0,1fr) auto}
  .r-blk>span:nth-child(2),.r-blk>span:nth-child(3){font-size:.85rem}
  .ess-sum{grid-template-columns:repeat(2,1fr)}
  .mpanel{grid-template-columns:1fr}
  .pond .cols{grid-template-columns:1fr}
  .ghead .gmeta .bar{display:none}
  .toolbar{gap:8px}
  .toolbar .seg{max-width:100%}
  .overlay{padding:0}
  .sheet{max-height:100vh;height:100%;border-radius:0;max-width:none}
  .sheet.small{height:auto;margin-top:auto;border-radius:16px 16px 0 0}
}

/* ---------- Skilltree ---------- */
.notice{margin:0 0 14px;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;background:var(--surface);font-size:.92rem}
.warn-txt{color:#ff6b6b}
.sk-wrap .mc{max-width:560px;margin:8px auto;background:linear-gradient(160deg,#22344a,#121c2a 70%);border:3px solid #0a111b;border-radius:10px;padding:12px 14px 16px;box-shadow:0 0 0 2px #2f4560,0 10px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.mc h2{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;margin:0 0 10px;font:700 1.35rem/1.1 "Courier New",monospace;color:#ffff55;text-shadow:2px 2px 0 #3f3f15,0 0 14px rgba(255,255,85,.25);letter-spacing:.5px}
.mcg{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;background:#05090a;border:3px solid #05090a;border-radius:4px}
.mcs{aspect-ratio:1;background:#14202e;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 0 0 2px #1d2c3e,inset 0 -6px 10px rgba(0,0,0,.25)}
.mcs.o{background:linear-gradient(135deg,#b4b4ae,#8f8f8a);box-shadow:inset 0 0 0 2px #a5a5a0,inset 0 0 0 3px rgba(255,255,255,.25),inset 0 -6px 10px rgba(0,0,0,.15)}
.mcs.i{background:radial-gradient(circle at 50% 35%,#2f4a66,#1b2d42);box-shadow:inset 0 0 0 2px #3b5f82,0 0 8px rgba(79,179,255,.18);cursor:pointer;transition:transform .12s,box-shadow .12s}
.mcs.i:hover{transform:translateY(-2px) scale(1.06);z-index:2;box-shadow:inset 0 0 0 2px #7fc4ff,0 0 14px rgba(79,179,255,.45)}
.mcc{position:absolute;right:3px;bottom:1px;font:700 11px/1 "Courier New",monospace;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;pointer-events:none}
@keyframes mcflash{0%{box-shadow:inset 0 0 0 2px #7fb4ff,0 0 14px 3px rgba(110,170,255,.65);background:radial-gradient(circle at 50% 35%,#3b6a8a,#24485f)}100%{}}
@keyframes mcflashneg{0%{box-shadow:inset 0 0 0 2px #ff7b7b,0 0 14px 3px rgba(255,90,90,.6);background:radial-gradient(circle at 50% 35%,#7a3b3b,#4f2424)}100%{}}
.mcs.i.flash{animation:mcflash 1.2s ease-out 1}
.mcs.i.flash.neg{animation:mcflashneg 1.2s ease-out 1}
.mcs.i.ro{cursor:pointer}
.mcs.i.ro:hover{transform:none}
.mcs.i.lk{cursor:not-allowed;background:#16222f}
.mcs.i.lk>svg,.mcs.i.lk>.mcc{opacity:.4;filter:grayscale(.8)}
.mcs.i.lk:hover{transform:none;box-shadow:inset 0 0 0 2px #3b5f82}
.mcs.i.max .mcc{color:#7dff9a}
.mcs.i.max{box-shadow:inset 0 0 0 2px #7dff9a,0 0 10px rgba(125,255,154,.45)}
.mcs.o.g{background:linear-gradient(135deg,#5fae3c,#3d7d26);box-shadow:inset 0 0 0 2px #7ad24f,inset 0 0 0 3px rgba(255,255,255,.2),inset 0 -6px 10px rgba(0,0,0,.2)}
.mct{display:none;position:absolute;bottom:108%;left:50%;transform:translateX(-50%);width:max-content;max-width:min(300px,70vw);background:#100010;color:#fff;border:2px solid #29d3e6;border-radius:3px;padding:7px 10px;font:14px/1.4 var(--font);text-align:left;z-index:5;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.mcs.tb .mct{bottom:auto;top:108%}
.mcs.tl .mct{left:0;transform:none}.mcs.tr .mct{left:auto;right:0;transform:none}
@media (hover:hover){.mcs.hd:hover .mct,.mcs.hd:focus-visible .mct{display:block}.skt .seg button:hover .mct.skm,.skt .seg button:focus-visible .mct.skm{display:block}}
.mctt{display:flex;align-items:center;gap:6px;font-weight:700;margin-bottom:5px}.mctt i{display:inline-flex;width:16px;height:16px}.mctt svg{width:16px;height:16px;filter:none}
.mctd{color:#e8e8e8}.mctd.w{color:#ff5555}
.skrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px) minmax(0,1fr);gap:16px;align-items:start}
.skrow .mc{margin:0;grid-column:2;grid-row:1}
.skside{grid-column:1;grid-row:1;justify-self:end;display:flex;flex-direction:column;gap:8px;width:100%;max-width:190px}

.skt{display:flex;justify-content:center;margin:4px 0 12px}

.skt .seg button{position:relative}
.mce{margin:6px 2px 4px;color:#9db3b6}

.skm .mctt{display:block;margin-bottom:5px}.skm .mctd{display:block}
.mg{color:#55ff55}.mctt.mcy{color:#55ffff}.mctt.mcw{color:#ffff55}

.sk-detail{max-width:560px;margin:14px auto 0;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius-s);padding:12px 16px}

@media(max-width:1060px){.skrow{grid-template-columns:1fr}.skrow .mc,.skside,.skbuy{grid-column:1}.skbuy{grid-row:3;justify-self:center;max-width:320px}.skside{grid-row:1;justify-self:center;flex-direction:row;width:auto}.skrow .mc{grid-row:2}}

/* ---------- Heller Modus ---------- */
html[data-theme=light]{color-scheme:light;
  --bg:#f2f5f9; --bg2:#eef2f7; --surface:#ffffff; --surface2:#f6f8fb; --surface3:#e7ecf2;
  --line:#dde3ea; --line2:#c9d2dd;
  --ink:#142030; --ink2:#2d3c50; --muted:#5a697c; --faint:#8794a6;
  --accent:#1b78c8; --accent2:#1766ab; --accent-ink:#ffffff; --accent-soft:rgba(27,120,200,.10);
  --warn:#d63a2f; --warn-soft:rgba(214,58,47,.08); --gold:#a8690f;
  --r-c:#7d8792; --r-g:#2f9a2a; --r-b:#2f63d6; --r-p:#8a43d6; --r-o:#d27a00; --r-n:#8a96a5; --r-u:#8a96a5;
  --shadow:0 10px 30px rgba(20,32,48,.15);
  --top-bg:rgba(255,255,255,.88); --tabs-bg:rgba(242,245,249,.94); --forge:#0b7f95; --stat:#1d5fa8; --cactus:#2aa864}
html[data-theme=light] body{background:radial-gradient(1200px 500px at 15% -10%,rgba(27,120,200,.06),transparent 60%),var(--bg)}
html[data-theme=light] .chip{color:var(--ink)}
html[data-theme=light] .row:hover{background:rgba(20,32,48,.025)}
html[data-theme=light] .gcard{background:linear-gradient(180deg,rgba(138,67,214,.06),transparent 40%),var(--surface)}
html[data-theme=light] .icon-btn.soc-tw{color:#7a3cf0} html[data-theme=light] .icon-btn.soc-dc{color:#4752c4}
html[data-theme=light] .overlay{background:rgba(20,32,48,.35)}
html[data-theme=light] .warn-txt{color:#c62f25}
.theme-btn .ico-sun{display:none} html[data-theme=light] .theme-btn .ico-sun{display:block} html[data-theme=light] .theme-btn .ico-moon{display:none}

@media (max-width:380px){.logo{display:none}.icon-btn{padding:7px 7px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Attribute-Planer ---------- */
.at-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:18px}
.at-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:14px 16px}
.at-card h2{font-size:1rem;margin:0 0 10px}
.at-src{display:grid;grid-template-columns:minmax(0,1fr) 92px 64px;gap:6px 10px;align-items:center;font-size:.9rem}
.at-src small{display:block;color:var(--muted);font-size:.75rem}
.at-src .input{width:100%;padding:6px 8px;text-align:right}
.at-src .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.at-sum{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-weight:600}
.at-big{display:flex;gap:10px;flex-wrap:wrap}
.at-big div{flex:1;min-width:90px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:center}

.at-big .over b{color:var(--warn)}.at-big .free b{color:var(--cactus)}
.at-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.at-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.at-row.has{border-left:4px solid var(--accent)}

.at-ctl .skb{width:36px;height:36px}

.at-res{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.92rem}

.at-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:16px}

.atg{background:radial-gradient(circle at 20% 30%,#7d4a2c 0 18%,transparent 19%),radial-gradient(circle at 75% 70%,#7d4a2c 0 14%,transparent 15%),#6f4126;border:3px solid #f0c552;border-radius:14px;box-shadow:inset 0 0 0 2px #3b2414,0 10px 26px rgba(0,0,0,.4);padding:12px 14px 16px;width:max-content;max-width:100%}

.at-rec,.at-rec svg,.ats svg{stroke:none}
.atb:disabled{filter:grayscale(.9) brightness(.8);opacity:.65;cursor:not-allowed}

.at-det .at-h{margin-bottom:10px}.at-det .at-ctl{margin-bottom:10px}

  "fishing": {
    "info": [
      
      "Jeder Spieler kann bis zu sieben Angel Slots besitzen. Diese gelten für alle Sets aus dem Kleiderschrank. Der erste Slot kostet 100 Münzen und die sechs weiteren Slots kosten jeweils 300 Kristalle.",
      "Nachdem erwerben des ersten Angel Slots kann man in diesem seine Angel ausrüsten. Diese erhält man automatisch. Um nun zu angeln muss man sich vorerst die Lizenz für den ersten See (Smaragdsee) im Eichenwald Biom kaufen (siehe Teiche).",
      "Mit Rechtsklick wirft man seine Angel aus, dann wartet man solange, bis ein Fisch anbeißt. Dies merkt man, indem auf dem Bildschirm ein Minispiel startet. Man versucht den Fisch dauerhaft in der grünen Box zubehalten, bis der grüne Balken voll ist. Die grüne Box bewegt man durch das Spammen der linken Maustaste.",
      "Durch das Angeln von Fischen steigert man sein normales Enzyklopädie Level. Dieses Level ist auf 32 begrenzt und ihr schaltet euch nach und nach Komponenten frei (siehe Komponenten).",
      "Die geangelten Fische können daraufhin bei dem NPC namens Rainpaw zerlegt werden. Dadurch erhält man verschiedenste Fisch Materialien. Diese werden für das Freischalten weiterer Teiche oder für das Herstellen von Komponenten benötigt.",
      "Ab und zu können auch Shiny Fischschwärme erscheinen. Durch das Angeln von Shiny Fischen steigert ihr euer Shiny Level. Dieses ist NICHT begrenzt und seasonübergreifend. Ihr erhaltet pro Level Aufstieg immer einen 0.2% Boni, der mit dem Standart Wert eines Teiches multipliziert wird.",
      "Die Fische sind in fünf verschiedenen Seltenheitsstufen unterteilt. Dazu gibt es verschiedene Farben der Schwärme: Grau, Grün, Blau, Lila und Gelb. In grauen Schwärmen findet man nur graue Fische. In grünen Schwärmen nur graue und grüne usw.",
      "Es kann durch die Fischreusen auch passiv geangelt werden. Jeder Spieler besitzt von Anfang an eine Fischreuse. Alle zehn weitere allgemeine Angellevel erhält man eine weitere Reuse. Diese platziert man, indem man das Wasser am Seerand rechtsklickt. Die Reusen können auch geupgradet werden (siehe Fischreusen)."
    ],

    return { id, name: m[1], tier: +m[2], base, need, got, have: Math.min(got, need), miss: Math.max(0, need - got), done: got >= need, wave: WAVE[k] };
  });
}
function essStats() {
  const L = essList(); let need = 0, have = 0, done = 0;
  for (const e of L) { need += e.need; have += e.have; if (e.done) done++; }
  return { list: L, need, have, done, total: L.length };
}
function parseAmount(v) {
  let s = String(v || '').trim().toLowerCase().replace(/\s/g, '');
  if (!s) return 0;
  let mul = 1;
  if (/[k]$/.test(s)) { mul = 1e3; s = s.slice(0, -1); } else if (/(m|mio)$/.test(s)) { mul = 1e6; s = s.replace(/(m|mio)$/, ''); }
  if (mul > 1) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/[.,]/g, '');
  const n = Math.round(parseFloat(s) * mul);
  return isFinite(n) && n > 0 ? n : 0;
}

function mobInfo(label) {
  const m = /^(.*?)\s*T(\d+)$/.exec(String(label).trim()); if (!m) return null;
  const name = MOBALIAS[m[1]] || m[1], tier = +m[2];
  return { label: label.trim(), name, tier, w: WAVE[name + tier] };
}
function planLevels(t) {
  let m = /^(\d+)\s*-\s*(\d+)$/.exec(t);
  if (m) { const a = Math.max(FIRST, +m[1]), b = Math.min(LAST, +m[2]), o = []; for (let L = a; L <= b; L++) o.push(L); return o; }
  m = /^(\d+)\s*\+\s*(\d+)$/.exec(t); return m ? [+m[1], +m[2]] : [];
}
const mobKeyOf = x => { const i = mobInfo(x); return i ? i.name + i.tier : x; };
function planMobs(r) {
  const miss = new Set(r.missing === '-' ? [] : r.missing.split(/,\s*/).map(mobKeyOf));
  const need = new Set(planLevels(r.levels).map(L => SEQ[L - FIRST]).filter(Boolean));
  if (r.extra !== '-') r.extra.split(/,\s*/).forEach(x => need.add(mobKeyOf(x)));
  const list = [...need].filter(k => !miss.has(k)).map(k => { const m = /^(.*?)(\d+)$/.exec(k); return m ? { n: m[1], t: +m[2] } : { n: k, t: 0 }; })
    .sort((a, b) => a.t - b.t || a.n.localeCompare(b.n, 'de'));
  return list.length ? list.map(o => o.t ? `${o.n} T${o.t}` : o.n).join(', ') : '-';
}
PAGES.ess = () => {
  const view = st.ui.essList;
  const essSeg = seg('essList', [['check', 'Checkliste'], ['list', 'Pro Level'], ['plan', 'Kombinierte Wellen']], view, 'accent');
  if (view !== 'list' && view !== 'plan') return PAGES.esscheck(essSeg);
  let body;
  if (view === 'plan') {
    const w = st.ui.wave || 0, P = D.essences.combined, cur = w ? P.reduce((a, r, i) => r.wave <= w ? i : a, -1) : -1;
    body = `<div class="notes" style="margin-top:0"><b>Hinweis:</b> ${esc(D.essences.combinedNote)}</div>
      <div class="toolbar"><label class="field">Deine aktuelle Welle <input class="input num" id="n-wave2" data-num="wave" inputmode="numeric" value="${st.ui.wave || ''}" placeholder="—"></label></div>
      <div class="list"><div class="list-head r-plan"><span>Machtkristall Level</span><span>Welle</span><span>Fehlende Mobs</span><span>Mobs</span></div>
      ${P.map((r, i) => {
        const miss = r.missing === '-' ? '<span class="muted">–</span>' : r.missing.split(/,\s*/).map(x => { const m = mobInfo(x); let info = '';
          if (m && m.w) info = ` <small class="muted">(beste Welle ${fmt(m.w)})</small>`;
          else if (m) { const o = Object.keys(WAVE).map(k => k.match(/^(.*?)(\d+)$/)).filter(k => k && k[1] === m.name).map(k => ({ t: +k[2], w: WAVE[k[0]] })).sort((p, q) => p.t - q.t);
            info = ` <small class="muted">(nicht in der Essenzliste${o.length ? ' – vorhanden: ' + o.map(v => `T${v.t} Welle ${fmt(v.w)}`).join(', ') : ''})</small>`; }
          return `<span class="miss">${esc(x)}</span>${info}`; }).join(', ');
        const cls = i === cur ? ' now' : (w && r.wave > w ? ' locked' : '');
        return `<div class="row r-plan${cls}"><span><small class="muted ml">MK-Level </small>${esc(r.levels)}</span><span class="num-l">${fmt(r.wave)}${i === cur ? ' <span class="badge">Du bist hier</span>' : ''}</span><span>${miss}</span><span class="ink2">${esc(planMobs(r))}</span></div>`;
      }).join('')}</div>`;
  } else {
    const q = norm(st.ui.q.esslist);
    const rows = SEQ.map((k, i) => { const m = k.match(/^(.*?)(\d+)$/); return { L: i + FIRST, amt: (i + FIRST + 1) * 1000, name: m[1], tier: +m[2], wave: WAVE[k] }; })
      .filter(r => !q || norm(`${r.name} t${r.tier} ${r.L}`).includes(q));
    body = `<div class="toolbar"><label class="search grow">${ICON.search}<input class="input" type="search" id="q-esslist" data-q="esslist" placeholder="Essenz oder Level suchen, z. B. „Piglin T3“ oder „120“" value="${esc(st.ui.q.esslist || '')}"></label></div>
      <div class="list"><div class="list-head r-ro4"><span class="num">Level</span><span class="num">Menge</span><span>Essenz</span><span class="num">Welle</span></div>
      ${rows.length ? rows.map(r => `<div class="row r-ro4"><span class="num">${r.L}</span><span class="num">${fmt(r.amt)}</span><span class="nm">${esc(r.name)}<span class="tier t${(r.tier - 1) % 6 + 1}">T${r.tier}</span></span><span class="num">${fmt(r.wave)}</span></div>`).join('') : emptyRow}</div>`;
  }
  return `<div class="page-head"><div><h1>Essenzen</h1><p>${view === 'plan' ? 'Wellen, in denen du mehrere Machtkristall-Level auf einmal farmen kannst.' : 'Welche Essenz du für welches Machtkristall-Level brauchst – Menge je Level = (Level + 1) × 1.000.'}</p></div>
    ${essSeg}</div>${body}`;
};

/* ---------- Essenz-Checkliste ---------- */
PAGES.esscheck = (essSeg = '') => {
  const E = essStats(), p = pct(E.have, E.need);
  const w = st.ui.wave, tierSel = +st.ui.essTier || 0, view = st.ui.essView;
  let L = E.list.filter(e => (!w || (e.wave || 0) <= w) && (!tierSel || e.tier === tierSel));
  L = filt('ess', L, e => `${e.name} t${e.tier}`, e => e.done);
  const head = `<div class="list-head r-ess"><span></span><span>Essenz</span><span class="num">Welle</span><span class="num">Benötigt</span><span class="num">Gesammelt</span><span class="num">Fehlt noch</span><span class="num">Fortschritt</span></div>`;
  const row = e => { const pp = pct(e.have, e.need); return `<div class="row r-ess${e.done ? ' done' : ''}" data-row="${e.id}">
    <input type="checkbox" class="cb" id="cb-${e.id}" data-ess="${e.id}" ${e.done ? 'checked' : ''} aria-label="${esc(e.name)} T${e.tier} komplett gefarmt">
    <label class="nm" for="cb-${e.id}">${esc(e.name)}<span class="tier t${(e.tier - 1) % 6 + 1}">T${e.tier}</span></label>
    <span class="num c-wave" data-l="Welle">${e.wave ? fmt(e.wave) : '–'}</span>
    <span class="num c-need" data-l="Benötigt">${fmt(e.need)}</span>
    <span class="c-in"><input class="amt-in" type="text" inputmode="numeric" id="amt-${e.id}" data-amt="${e.id}" value="${e.got ? fmt(e.got) : ''}" placeholder="0" aria-label="Bereits gesammelt: ${esc(e.name)} T${e.tier}"></span>
    <span class="num c-miss ${e.miss ? '' : 'okc'}" data-l="Fehlt">${e.miss ? fmt(e.miss) : '✓'}</span>
    <span class="pct">${pctTxt(pp)}${bar(pp, 'thin')}</span></div>`; };
  let list;
  if (!L.length) list = `<div class="list">${emptyRow}</div>`;
  else if (view === 'tier') {
    list = ''; for (let t = 1; t <= 12; t++) {
      const g = L.filter(e => e.tier === t).sort((a, b) => b.base - a.base || a.name.localeCompare(b.name, 'de')); if (!g.length) continue;
      const need = g.reduce((s, e) => s + e.need, 0), have = g.reduce((s, e) => s + e.have, 0);
      list += `<div class="tierhead t${(t - 1) % 6 + 1}"><h2>Tier ${t}</h2><span>${fmt(have)} / ${fmt(need)} · ${pctTxt(pct(have, need))}</span></div><div class="list">${head}${g.map(row).join('')}</div>`;
    }
  } else {
    const sorted = L.slice().sort(view === 'name' ? (a, b) => a.name.localeCompare(b.name, 'de') || a.tier - b.tier : (a, b) => a.need - b.need || a.tier - b.tier);
    list = `<div class="list">${head}${sorted.map(row).join('')}</div>`;
  }
  const num = (k, label, ph, max) => `<label class="field">${label}<input class="input num" id="n-${k}" data-num="${k}" inputmode="numeric" maxlength="${max}" value="${st.ui[k] && !(k === 'mk' && st.ui[k] === 1) ? st.ui[k] : ''}" placeholder="${ph}"></label>`;
  return `<div class="page-head"><div><h1>Essenzen</h1><p>Trage ein, wie viel du schon gefarmt hast – der Rest wird automatisch berechnet.</p></div>${essSeg}</div>
    <div class="card"><div class="ess-sum">
      <div class="stat"><b>${fmt(E.have)}</b><span>gefarmt (Menge)</span></div>
      <div class="stat"><b>${fmt(E.need - E.have)}</b><span>noch benötigt (Menge)</span></div>
      <div class="stat"><b>${E.done} / ${E.total}</b><span>Essenzen komplett</span></div>
      <div class="stat"><b>${pctTxt(p)}</b><span>Fortschritt nach Menge</span></div></div>${bar(p)}</div>
    <div class="toolbar">
      ${num('from', 'Von Level', FIRST, 3)}${num('to', 'Bis Level', LAST, 3)}${num('wave', 'Aktuelle Welle', 'alle', 5)}${num('mk', 'Machtkristalle', '1', 4)}
      <button class="linkbtn" type="button" data-reset="ess">Mengen zurücksetzen</button>
    </div>
    ${toolbar('ess', null, `${seg('essView', [['tier', 'Nach Tier'], ['amt', 'Nach Menge'], ['name', 'Nach Name']], view)}
      <label class="field">Tier<select class="select" data-ui="essTier"><option value="0">Alle</option>${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}"${tierSel === i + 1 ? ' selected' : ''}>T${i + 1}</option>`).join('')}</select></label>`)}
    ${w ? `<p class="muted small">Es werden nur Essenzen bis Welle ${fmt(w)} angezeigt.</p>` : ''}
    ${list}`;
};

  if (extra) return `<div class="page-head"><div><h1>Ausrüstungssets</h1><p><b>Late-Game-Möglichkeit</b> als Alternative zum DMG Late (Boss) Set: Münz- und Amboss-Set, leicht verbessert und verändert – mit allen Ressourcen. Zählt nicht zum Fortschritt auf dem Dashboard.</p></div></div>` + chooser + lateHtml('blocks', '');
  const setChooser = chooser + `
    ${S.stages.length > 1 ? `<div class="toolbar">${seg('stage.' + S.id, S.stages.map(x => [x.id, x.label]), g.id)}</div>` : ''}`;
  const head = `<div class="page-head"><div><h1>Ausrüstungssets</h1><p>Jedes Teil einzeln abhaken. Klappe „Materialien“ auf, um Herstellungskosten zu sehen und Materialien abzuhaken.</p></div></div>`;

  const allIds = g.items.flatMap(x => copyIds(S, x).map(c => c.id)), done = allIds.filter(on).length;
  let items = filt('sets', g.items, x => `${x.name} ${x.part} ${x.level}`, x => itemDone(S, x));
  items = sortBy('sets', items, { lvl: byLvl, name: byName, part: (a, b) => a.part.localeCompare(b.part, 'de') || byLvl(a, b) });
  const two = !!S.copies;
  const checks = x => two ? `<span class="copies">${S.copies.map((lab, k) => { const cc = copyIds(S, x).find(c => c.k === k);
      return cc ? `<label class="cpill${on(cc.id) ? ' on' : ''}" title="${esc(lab)} hergestellt">${cb(cc.id, x.name + ' (' + lab + ') erledigt', 'sm')}${esc(lab.split(' ')[0])}</label>` : `<span class="cpill none" title="Für ${esc(lab)} nicht nötig">–</span>`; }).join('')}</span>` : cb(x.id, x.name + ' erledigt');
  const rows = items.map(x => { const c = costFor(x.name, x.level); return `<div class="row ${two ? 'r-set2' : 'r-set'}${itemDone(S, x) ? ' done' : ''}" data-row="${esc(x.id)}">
    ${checks(x)}<span class="c-part"><span class="chip ${x.rarity}" title="${esc(D.rarity[x.rarity] || '')}">${esc(x.part)}</span></span>${lvCell(x.level)}
    <label class="nm${x.warn ? ' warn-cell' : ''}" ${two ? '' : `for="cb-${esc(x.id)}"`}>${esc(x.name)}</label><span class="c-mat">${matToggle(x.id, c)}</span>${matPanel(x.id, c)}</div>`; }).join('');
  return head + setChooser + `<h2 style="margin:6px 0 12px">${esc(S.title)} <span class="muted">[${esc(g.label)}]</span></h2>
    ${two ? `<p class="muted small" style="margin:-4px 0 10px">Dieses Set stellst du 2x her: ${S.copies.map(esc).join(' und ')}. Jedes Teil hat deshalb zwei Haken.</p>` : ''}
    ${progressCard('', done, allIds.length, `data-reset="stage"`, `<button class="linkbtn" type="button" data-reset="sets">Alle Sets zurücksetzen</button>`)}
    ${toolbar('sets', [['lvl', 'Ebene'], ['name', 'Name'], ['part', 'Teil']])}
    <div class="list"><div class="list-head ${two ? 'r-set2' : 'r-set'}"><span>${two ? 'Hergestellt' : ''}</span><span>Teil</span><span class="ctr">Ebene</span><span>Gegenstand</span><span></span></div>${rows || emptyRow}</div>
    <div style="margin-top:10px">${legend()}</div>
    ${g.notes.length ? `<aside class="notes"><h3>Notizen</h3><ul>${g.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></aside>` : ''}`;
};

  let items = filt(scope, list, x => `${x.aspect} ${x.item} ${x.part}`, x => on(x.id));
  items = sortBy(scope, items, { lvl: byLvl, name: (a, b) => a.aspect.localeCompare(b.aspect, 'de') });
  return items.map(x => { const c = costFor(x.item, x.level); return `<div class="row r-asp${on(x.id) ? ' done' : ''}" data-row="${esc(x.id)}">
    ${cb(x.id, x.aspect + ' erledigt')}<span class="c-part muted">${esc(x.part)}</span><label class="nm${x.warn ? ' warn-cell' : ''}" for="cb-${esc(x.id)}">${esc(x.aspect)}<small class="hide-d">${esc(x.part)}</small></label>${lvCell(x.level)}
    <span class="c-item">${esc(x.item)} ${matToggle(x.id, c)}</span><span class="c-range muted small">${esc(x.range)}</span>${matPanel(x.id, c)}</div>`; }).join('') || emptyRow;
}

/* ---------- Schmiedelevel & Baupläne ---------- */
PAGES.bp = () => {
  const lvl = st.ui.lvl, all = D.blueprints.flatMap(g => g.items), done = all.filter(x => on(x.id)).length;
  let nextHtml = '';
  if (lvl) {
    const avail = all.filter(x => x.level <= lvl && !on(x.id)).length;
    const nextL = all.filter(x => x.level > lvl).map(x => x.level).sort((a, b) => a - b)[0];
    const nextItems = nextL ? all.filter(x => x.level === nextL) : [];
    nextHtml = `<div class="notes"><b>Freigeschaltet & offen:</b> ${avail} Baupläne · ${nextL ? `<b>Als Nächstes ab Ebene ${nextL}:</b> ${nextItems.map(x => esc(x.display || x.name)).join(', ')}` : 'Alle Ebenen freigeschaltet.'}</div>`;
  }
  const groups = D.blueprints.map(g => {
    const gid = 'bp.' + g.group, open = !st.ui.closed[gid], gd = g.items.filter(x => on(x.id)).length;
    let items = filt('bp', g.items, x => `${x.name} ${x.display || ''} ${x.level}`, x => on(x.id));
    items = sortBy('bp', items, { lvl: byLvl, name: byName });
    const rows = items.map(x => { const c = costFor(x.name, x.level); return `<div class="row r-bp${on(x.id) ? ' done' : ''}${lvl && x.level > lvl ? ' locked' : ''}" data-row="${esc(x.id)}">
      ${cb(x.id, (x.display || x.name) + ' erledigt')}<label class="nm" for="cb-${esc(x.id)}">${esc(x.display || x.name)}${lvl && x.level > lvl ? '<small>noch gesperrt</small>' : ''}</label>${lvCell(x.level)}<span class="c-mat">${matToggle(x.id, c)}</span>${matPanel(x.id, c)}</div>`; }).join('');
    return `<div class="group" data-gopen="${open}"><button type="button" class="ghead" data-group="${esc(gid)}" aria-expanded="${open}"><h2>${ICON.chev}${esc(g.group)}</h2><span class="gmeta">${gd} / ${g.items.length}${bar(pct(gd, g.items.length))}</span></button>
      ${open ? `<div class="list">${rows || emptyRow}</div>` : ''}</div>`;
  }).join('');
  return `<div class="page-head"><div><h1>Schmiedelevel &amp; Baupläne</h1><p>Alle Baupläne mit der benötigten Ebene. Überschriften lassen sich auf- und zuklappen.</p></div></div>
    ${progressCard('', done, all.length, 'data-reset="bp"')}
    ${toolbar('bp', [['lvl', 'Ebene'], ['name', 'Name']], `<label class="field">Deine Ebene<input class="input num" id="n-lvl" data-num="lvl" inputmode="numeric" maxlength="3" value="${lvl || ''}" placeholder="—"></label>`)}
    ${nextHtml}${groups}`;
};

const aic = k => `<svg viewBox="0 0 48 48" aria-hidden="true">${AICON[k] || ''}</svg>`;
const dec = (n, d = 1) => Number(n).toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: d });
function atBudget() {
  const s = st.at.src; let sum = 0;
  for (const q of A.sources) sum += Math.floor((s[q.id] || 0) / q.div) * q.per;
  return { calc: sum, total: s.total ? s.total : sum, manual: !!s.total };
}
function atUsed() { return A.list.reduce((a, x) => a + (st.at.p[x.id] || 0), 0); }
const UNS = '<span class="unsure" title="Das Wiki nennt keine genaue Formel – Bereich aus den bekannten Werten abgeleitet">ungefähr</span>';
function atResult(x, n) {
  if (!n) return '<span class="muted">Noch keine Punkte.</span>';
  switch (x.kind) {
    case 'vit': {
      if (n === 1) return '<b>+4</b> Lebenspunkte';
      if (n <= 95) return `zwischen <b>+${fmt(4 * n)}</b> und <b>+${fmt(8 * n)}</b> Lebenspunkte ${UNS}`;
      return `mindestens <b>+${fmt(380 + 8 * (n - 95))}</b>, höchstens <b>+${fmt(8 * n)}</b> Lebenspunkte ${UNS}<br><small class="muted">Die letzten ${n - 95} Punkte geben sicher je +8 (= +${fmt(8 * (n - 95))}).</small>`;
    }
    case 'dmg': return `<b>+${fmt(n)}</b> ${x.dmg} und <b>+${fmt(n)} %</b> ${x.dmg}`;
    case 'def': return `<b>−${fmt(n)}</b> Schaden pro gegnerischem Treffer`;
    case 'luck': return 'Höhere Material-Dropchance <span class="muted">(keine Zahlen im Wiki)</span>';
    case 'crit':
      if (n === 1) return '<b>0,7 %</b> Kritchance';
      if (n === 100) return '<b>44,6 %</b> Kritchance';
      if (n < 100) return `zwischen <b>${dec(0.446 * n)} %</b> und <b>${dec(0.7 * n)} %</b> Kritchance ${UNS}`;
      return `über <b>44,6 %</b> Kritchance ${UNS}<br><small class="muted">Bekannt ist nur: 100 Punkte = 44,6 %.</small>`;
    case 'critdmg': return `<b>+${fmt(n)}</b> Kritschaden${n === 1 ? ', Multiplikator <b>1,02</b>' : ` + Multiplikator ${UNS}<br><small class="muted">Der Multiplikator beginnt bei 1,02; weitere Werte nennt das Wiki nicht.</small>`}`;
    case 'eva': return n >= 100 ? `<b>fast 100 %</b> Ausweichchance <small class="muted">(100 % ist nicht erreichbar)</small>` : `<b>${fmt(n)} %</b> Ausweichchance`;
  }
  return '';
}

function lateHtml(v, head) {
  if (v === 'blocks') {
    const LB = D.lateBlocks;
    const ov = LB.overview.map(o => {
      const B = LB.blocks.find(b => b.id === o.ref);
      const cd = B ? B.crafts.filter(c => on(c.id)).length : 0, ct = B ? B.crafts.length : 0, ok = B && cd === ct;

  for (const k of Object.keys(st.checks)) { const base = k.split('::m::')[0]; if (set.has(k) || set.has(base)) delete st.checks[k]; }

}
async function doReset(kind) {

  if (kind.startsWith('block:')) { const B = D.lateBlocks.blocks.find(b => b.id === kind.slice(6)); if (B) return resetIds([...B.crafts.flatMap(c => [c.id, ...c.resources.map(r => r.id)]), ...B.totals.flat().map(r => r.id), ...(B.fill ? B.fill.items.map(x => x.id) : [])], B.title); }
  if (kind === 'fab') return resetIds(D.fabrik.levels.map(x => x.id), 'Fabriklevel');

    if (v) o[k] = v; else delete o[k];
    clearTimeout(numT); numT = setTimeout(rerender, 300); return;
  }
  if (t.dataset.num) {
    t.value = t.value.replace(/\D/g, '');
    const k = t.dataset.num, v = Math.floor(+t.value);
    clearTimeout(numT);
    numT = setTimeout(() => {
      if (k === 'mk') st.ui.mk = v >= 1 ? Math.min(v, 9999) : 1;
      else if (k === 'wave') st.ui.wave = v > 0 ? v : null;

      else if (k === 'fl') st.ui.fl = v > 0 ? Math.min(v, 9999) : null;
      else st.ui[k] = v >= FIRST ? Math.min(v, LAST) : null;
      rerender();
    }, 250);
    return;
  }
  if (t.id === 'gq') runSearch();
});
